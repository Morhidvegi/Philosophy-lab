const CHAPTERS=[
[["The first philosophical shift","The earliest Greek philosophers did not suddenly stop believing in myth. What changed was the growing use of publicly discussable arguments about nature. Thales proposed water as a fundamental principle; Anaximander proposed the apeiron, an indefinite or boundless origin; Pythagorean thinkers explored number and order."],["Heraclitus","Heraclitus emphasizes change, conflict and an underlying logos or rational order. His philosophy is often simplified to 'everything changes,' but the deeper question is how order can exist within constant transformation."],["Parmenides","Parmenides argues that what-is cannot come from what-is-not and cannot simply become nothing. He therefore challenges the intelligibility of genuine coming-to-be and passing-away. His poem creates a problem later philosophers have to solve: how can ordinary experience of change be reconciled with rational argument?"],["Atomists","Democritus and other atomists propose indivisible bodies moving through empty space. This is an early attempt to explain change without requiring things to emerge from absolute nothing."],["Question to carry forward","If your senses tell you that everything changes but an argument seems to show that genuine change is impossible, which should you trust—and why?"]],

[["Who was Socrates?","Socrates lived in Athens and became famous for philosophical conversations. He did not leave books behind. Later authors disagree about details, so the 'Socratic problem' asks how to reconstruct the historical philosopher from conflicting sources."],["Questioning definitions","Socrates often begins with a request for a definition: What is courage? What is justice? What is piety? He then tests the answer against other cases. This reveals a crucial philosophical distinction between having a word for something and understanding the concept."],["Aporia","Aporia is the condition of puzzlement reached when an argument undermines the confidence of everyone involved. For Socratic philosophy, this is not failure. Discovering that you do not yet know can be the beginning of inquiry."],["The examined life","Socrates treats examination of one's beliefs and character as morally important. The famous image of the examined life is therefore not simply 'think a lot'; it is the demand to inspect the reasons behind the way you live."],["Question to carry forward","Can someone be a good person if they never examine why they believe their actions are good?"]],

[["The Forms","Plato's Forms are not simply physical objects in another location. They are intelligible standards involved in explaining how knowledge can concern stable things despite a changing sensory world. The exact status of Forms varies across Plato's dialogues."],["The Cave","The Cave represents a movement from limited appearance toward intellectual understanding. The prisoners are not merely stupid; their entire environment has trained them to interpret shadows as reality. Education therefore requires a transformation of perspective, not just the addition of facts."],["Knowledge and opinion","Plato distinguishes unstable opinion from knowledge that has a stronger rational basis. Mathematics becomes important because it demonstrates how reasoning can concern structures that are not changing from moment to moment."],["Justice","In the Republic, Plato investigates justice in both the individual and the city. His controversial political proposals are connected to his larger claim that education and character matter for political order."],["Question to carry forward","If you discovered that a belief you considered obvious was only produced by your environment, how would you tell the difference between truth and conditioning?"]],

[["Substance and explanation","Aristotle asks what things are and how they can change while remaining identifiable. His account of substance and form tries to explain both stability and change without separating reality into a completely different realm."],["The four causes","Material cause answers what something is made of; formal cause concerns its structure; efficient cause concerns what brings it about; final cause concerns its end or function. These are four explanatory angles, not four separate physical pushes."],["Eudaimonia","Aristotle's ethics begins with the question of the human good. Eudaimonia means flourishing or living well. It is an activity of a whole life, not a temporary emotional state."],["Virtue and habit","Courage, justice and other virtues become stable dispositions through practice. A person becomes courageous by repeatedly responding appropriately to fear—not by memorizing a definition of courage."],["Practical wisdom","Because real situations vary, ethics cannot be reduced to mechanical rules. Phronesis, or practical wisdom, is the ability to deliberate well about what should be done in particular circumstances."],["Question to carry forward","Is a good action enough, or does becoming a good person require changing your habits and character?"]],

[["Stoicism","Stoics such as Zeno, Epictetus, Seneca and Marcus Aurelius argue that virtue is the central good and that our judgments should be disciplined. Their distinction between what depends on us and what does not is a practical exercise in agency."],["Epicureanism","Epicurus argues that pleasure is the good, but his understanding of pleasure is far less hedonistic than the modern stereotype. Stable pleasure involves freedom from pain and disturbance, modest desires and strong friendships."],["Cynicism","Cynic philosophers such as Diogenes attack dependence on convention, wealth and status. Their provocative lifestyle is meant to demonstrate how much of ordinary desire is socially manufactured."],["Philosophy as therapy","These schools treat philosophy as something that should change how you live. The test of a theory is partly whether it helps transform fear, desire, anger and dependence on external approval."],["Question to carry forward","Would you rather have a philosophy that explains reality brilliantly or one that reliably improves how you live? Why?"]],

[["Time","Augustine asks what time actually is. The past is no longer present, the future is not yet present, and the present seems to vanish immediately. His reflections connect time with memory, attention and expectation."],["Memory","Memory becomes an enormous interior space containing images, knowledge and emotional traces. Augustine's introspection makes consciousness itself a philosophical object."],["Evil","Augustine develops a privation account of evil: evil is not necessarily a substance competing with good, but a corruption or lack of good. This attempts to address how evil can exist without requiring an independent evil principle."],["Desire and will","Augustine examines the experience of wanting one thing while doing another. This becomes important for later philosophical discussions of weakness of will and moral psychology."],["Question to carry forward","If you cannot directly observe the past or future, in what sense do you experience time at all?"]],

[["A long conversation","Medieval philosophy is not simply a gap between Aristotle and modernity. Christian, Islamic and Jewish philosophers translated, criticized and transformed ancient ideas. Thinkers such as Avicenna, Averroes, Maimonides, Anselm and Aquinas developed sophisticated arguments about God, reason, causation, universals and ethics."],["Reason and faith","A major question is whether philosophical reasoning can establish truths about God and how revealed religion relates to rational inquiry. Different thinkers draw the boundaries differently."],["Universals","The problem of universals asks whether general concepts such as 'redness' or 'humanity' correspond to realities outside individual things, or whether they are concepts or names created by the mind and language."],["Why it matters","Many modern philosophical questions inherit problems sharpened during this period: causation, necessity, mind, language, ethics and the limits of reason."],["Question to carry forward","If reason and tradition disagree, what method could decide between them?"]],

[["The scientific shift","The Scientific Revolution changes standards of explanation. Observation, experiment and mathematical description become increasingly important. Philosophers ask what makes a method reliable and what mathematics tells us about nature."],["Descartes","Descartes responds to uncertainty by doubting everything that can coherently be doubted. The cogito gives him a starting point, after which he attempts to reconstruct knowledge."],["Mind and body","Descartes's distinction between thinking and extended substance contributes to the modern mind-body problem. If mental experience and physical matter are fundamentally different, how can they interact?"],["Rationalism","Descartes, Spinoza and Leibniz give reason a major role in knowledge. They differ significantly, but all challenge the idea that sensory experience alone can provide the deepest foundations of thought."],["Question to carry forward","What belief do you think you could still defend if you were forced to doubt your senses?"]],

[["Experience","Empiricist philosophers emphasize experience. Locke argues that the mind is not born with a full stock of ideas; Berkeley challenges assumptions about material substance; Hume pushes empiricism toward skepticism."],["Causation","Hume distinguishes what is directly experienced from what habit leads us to expect. We observe repeated sequences, but the necessary connection itself is not presented to the senses."],["Induction","The problem of induction is devastatingly simple: why should the future resemble the past? Any attempt to answer using past regularity seems to assume what it is trying to prove."],["Personal identity","Hume looks inward and finds a stream or bundle of perceptions rather than an obvious single permanent self. This raises a question that remains central in philosophy of mind."],["Question to carry forward","When you say 'I know,' how much of that knowledge is observation and how much is a habit of expecting things to continue?"]],

[["The critical project","Kant is often said to have been awakened from his 'dogmatic slumber' by Hume. His project is not to choose blindly between rationalism and empiricism but to explain the conditions under which experience and knowledge are possible."],["Mind structures experience","Kant argues that space and time are forms through which human sensibility receives experience, while categories such as causality help organize objects of experience. This does not mean the external world is imaginary."],["Phenomena and noumena","Phenomena are things as they appear within human experience. Noumena refer to things considered independently of that mode of appearance. Kant argues that theoretical knowledge is limited to phenomena."],["The categorical imperative","Kant's moral philosophy asks whether the principle behind your action could be willed as universal. He also insists that rational persons must be treated as ends, not merely as tools."],["Question to carry forward","If everyone adopted the rule behind your action, would the rule still make sense?"]],

[["Hegel","Hegel sees history and thought as dynamic processes in which contradictions and tensions can produce transformations. His dialectical method is complex and should not be reduced to a simple formula of thesis-antithesis-synthesis."],["Marx","Marx shifts attention toward material conditions, labor, class and political economy. He asks how social structures shape consciousness and how economic relations become experienced as natural or inevitable."],["Kierkegaard","Kierkegaard turns toward the individual, anxiety, despair and commitment. He worries that systems can describe humanity while failing to tell the individual how to exist."],["Schopenhauer","Schopenhauer interprets reality through Will and emphasizes the endless cycle of desire, temporary satisfaction and renewed wanting. He explores art and compassion as possible interruptions."],["Nietzsche","Nietzsche interrogates the history of values. He asks where morality came from, what psychological forces shaped it and what happens when inherited religious foundations lose their authority."],["Question to carry forward","Which is more fundamental to a person's life: their individual choices or the historical and social conditions surrounding those choices?"]],

[["Phenomenology","Husserl develops phenomenology as a rigorous investigation of experience. Heidegger transforms the approach toward questions of Being, temporality and situated existence."],["Heidegger","Heidegger asks what it means for anything to be and examines everydayness, anxiety, mortality and authenticity. His concept of das Man describes the anonymous social 'They' that can determine what people think is normal."],["Sartre","Sartre makes freedom and responsibility central. Humans are situated in circumstances they did not choose, but they still participate in defining themselves through action. Bad faith describes evasion of this freedom."],["Camus","Camus's Absurd is the collision between the human demand for meaning and a world that does not guarantee one. His response is revolt, lucid living and solidarity rather than surrender."],["Wittgenstein","Wittgenstein's later philosophy investigates language games and the way words function in practices. Philosophical confusion can arise when we force language into an abstract picture that does not match its use."],["Rawls","Rawls develops the original position and veil of ignorance as a way to think about justice without knowing one's own social position."],["Question to carry forward","If philosophy cannot give you a final answer to the meaning of life, what could philosophy still reasonably give you?"]]
];

const DEEP_P=[{"id":"thales","name":"Thales of Miletus","dates":"c. 624–546 BCE","era":"Archaic Greece","school":"Milesian natural philosophy","portrait":"T","intro":"Thales is traditionally treated as one of the earliest Greek philosophers because he sought a natural principle of the world rather than explaining everything through a genealogy of gods. Almost nothing survives directly from him, so later reports must be handled carefully.","body":[["The search for a principle","Thales is associated with the claim that water is the fundamental principle, or arche, of nature. The important philosophical move is not simply the answer 'water' but the attempt to explain a diverse world through an underlying natural principle."],["Myth and argument","Greek myth already contained accounts of origins. What changes in Milesian thought is the growing expectation that explanations should be discussable, comparable and connected to observations about nature."],["Why water?","Ancient reports suggest water was connected with nourishment, moisture and the generation of living things. We should not project modern chemistry onto the claim. It belongs to an early attempt to identify a unifying feature of nature."],["The philosophical problem","Once you posit a basic principle, a new question appears: how can the many things we experience arise from one underlying reality? That problem becomes central to later Presocratic theories."],["Historical importance","Thales matters less because his answer survives as a plausible scientific theory and more because he represents an early stage in the transition toward naturalistic explanation and rational debate."],["Primary texts to know","Later reports about Thales appear in Aristotle and doxographical traditions; no secure complete work survives."],["A serious objection","His surviving doctrine is reconstructed from later sources, so claims about his exact reasoning are uncertain. Treat 'Thales believed X' more cautiously than a claim based on a surviving text."]]},{"id":"anaximander","name":"Anaximander","dates":"c. 610–546 BCE","era":"Archaic Greece","school":"Milesian natural philosophy","portrait":"A","intro":"Anaximander was a Milesian thinker who pushed the search for a first principle beyond an ordinary material substance. He is associated with the apeiron, the indefinite or boundless, and with early speculative accounts of cosmic order and living things.","body":[["The apeiron","Instead of choosing water, air or another familiar substance, Anaximander is associated with the apeiron: something indefinite or boundless. This lets him ask how opposites such as hot and cold can emerge without one ordinary substance simply being the winner."],["Opposites and order","The world is described through tensions between opposites. Later summaries connect this with a notion of justice or compensation, suggesting that cosmic order involves limits and balance."],["Cosmology","Anaximander proposed a model of the cosmos in which celestial bodies are explained through natural structures rather than purely divine genealogy. His cosmology is speculative and should not be confused with modern astronomy."],["Life and humans","Ancient reports attribute striking ideas about the origins of living creatures and humans to Anaximander. Some reports say life began in moisture and that humans arose through earlier animal forms, though the evidence is fragmentary."],["Why he matters","Anaximander demonstrates an important philosophical strategy: when an explanation seems too specific, ask whether a more abstract principle is needed to explain how opposites and diversity arise."],["Primary texts to know","Fragments and testimonia are preserved through later authors, especially Aristotle and Simplicius."],["A serious objection","The evidence is extremely fragmentary. Modern reconstructions can easily turn a few ancient reports into a complete system Anaximander may never have written."]]},{"id":"heraclitus","name":"Heraclitus","dates":"c. 535–475 BCE","era":"Archaic Greece","school":"Presocratic philosophy","portrait":"H","intro":"Heraclitus of Ephesus is famous for emphasizing change, conflict and the logos. He is often reduced to the slogan that everything flows, but the surviving fragments are more interesting: they investigate how order, unity and intelligibility can exist within a world of continual transformation.","body":[["Flux","Heraclitus repeatedly emphasizes transformation. Things are not simply static objects; their identities and conditions emerge through processes and tensions. This makes change philosophically fundamental rather than a superficial feature of reality."],["Logos","The logos can be understood as an account, principle or rational structure. Heraclitus suggests that the logos is common, while individuals often live as though their private perspective were enough."],["Unity of opposites","Heraclitus uses paired opposites—day and night, waking and sleeping, life and death—to explore dependence and transformation. Opposition does not necessarily mean pure contradiction; it can reveal relationships within a process."],["Conflict","Conflict is not merely social chaos. Heraclitus treats tension as productive of order, famously describing strife as a principle of differentiation. This later became important to interpretations of dialectical thought."],["Reading him well","Because the fragments are compressed and poetic, each sentence can support multiple interpretations. The best approach is to compare clusters of fragments rather than treating one famous line as a complete doctrine."],["Primary texts to know","Fragments preserved by later writers; modern editions group and translate them from testimonia."],["A serious objection","The 'everything changes' interpretation is too simple. Heraclitus is equally interested in stability, law, logos and the structured relations that make change intelligible."]]},{"id":"parmenides","name":"Parmenides","dates":"early 5th century BCE","era":"Eleatic philosophy","school":"Eleaticism","portrait":"P","intro":"Parmenides of Elea wrote a poem in which a goddess distinguishes the way of truth from ordinary mortal opinion. His argument that what-is cannot come from what-is-not created a major challenge for any philosophy that wants to explain change, plurality and coming-to-be.","body":[["The way of truth","Parmenides argues that what-is is and what-is-not cannot be. Since 'what-is-not' cannot be thought or spoken of coherently, coming-to-be from nothing appears impossible."],["Being","The consequences are radical: genuine being cannot simply arise from non-being or become non-being. Parmenides is therefore pushed toward a conception of reality as ungenerated and imperishable."],["Change and plurality","If reality is genuinely what-is, then ordinary claims about change and multiplicity become philosophically difficult. Later philosophers such as Empedocles and the atomists can be read as attempts to answer this challenge."],["Appearance","Parmenides does not simply say 'your senses are useless.' His poem distinguishes a rational route of truth from a mortal account of appearances. The philosophical problem is how, or whether, everyday experience can be reconciled with strict reasoning."],["Why he matters","Parmenides forces philosophy to ask whether a concept can be coherent even when it conflicts with ordinary experience. That tension between argument and appearance becomes a permanent philosophical theme."],["Primary texts to know","On Nature survives only in fragments quoted by later authors."],["A serious objection","Interpreting Parmenides as simply denying all sensory reality may go too far; the poem's second part suggests a sophisticated account of mortal opinion, even if its exact status is debated."]]},{"id":"democritus","name":"Democritus","dates":"c. 460–370 BCE","era":"Classical Greece","school":"Atomism","portrait":"D","intro":"Democritus developed atomism: the idea that reality consists of indivisible bodies moving through empty space. His theory offers a way to explain change and plurality while answering the Eleatic challenge that nothing can arise from absolute nothing.","body":[["Atoms and void","Atoms are indivisible bodies differing in shape, arrangement and position; the void provides space for motion. This gives atomism a basic ontology of things and relations rather than qualities alone."],["Explaining change","A tree can change without its basic constituents appearing from nothing. Change becomes rearrangement. This is one of atomism's most powerful explanatory ambitions."],["Qualities","Ancient atomists distinguish properties belonging to atoms themselves from qualities that arise in interaction with observers. This creates an early version of a distinction later philosophers make between primary and secondary qualities."],["Mind and soul","Democritean materialism also treats soul-related phenomena in natural terms. Thought is connected with fine, mobile constituents rather than a completely separate immaterial substance."],["Ethics","Democritus is also associated with ethical fragments about cheerfulness, moderation and inner balance. The ethical side of his thought reminds us that ancient natural philosophy was not always separated from questions about living well."],["Primary texts to know","Fragments and testimonia survive through later writers; no complete Democritean work survives."],["A serious objection","Ancient atomism should not be treated as identical to modern physics. Its atoms, void and explanatory categories belong to a very different conceptual framework."]]},{"id":"diogenes","name":"Diogenes of Sinope","dates":"c. 412–323 BCE","era":"Hellenistic Greece","school":"Cynicism","portrait":"D","intro":"Diogenes of Sinope became the legendary exemplar of Cynicism. Cynic philosophy challenged social convention by treating independence, self-sufficiency and virtue as more important than wealth, reputation and status. Stories about Diogenes are often exaggerated, but their philosophical purpose is revealing.","body":[["Convention versus nature","Cynics ask which desires are genuinely natural and which are manufactured by social convention. Clothing, prestige, wealth and etiquette can become examples of things people pursue because society teaches them to value them."],["Self-sufficiency","Autarkeia, or self-sufficiency, means reducing dependence on external goods. The Cynic ideal is not merely poverty for its own sake but freedom from unnecessary needs."],["Provocation as philosophy","Diogenes is associated with deliberately shocking behavior. The point of a Cynic provocation is philosophical: expose how arbitrary social norms can look when stripped of their prestige."],["Cosmopolitanism","Cynic tradition helped popularize the idea of being a citizen of the cosmos rather than identifying completely with one city or political community. Stoicism later develops this theme in a different form."],["Why he matters","Diogenes turns philosophy into a test of whether beliefs survive practice. If someone claims that status does not matter, how much does their behavior depend on status?"],["Primary texts to know","Later biographies, anecdotes and sayings, especially Diogenes Laertius; attribution of individual stories is uncertain."],["A serious objection","The historical Diogenes and the literary character called 'Diogenes' are not identical. Anecdotes may have been shaped over generations to express Cynic ideals."]]},{"id":"zeno_citium","name":"Zeno of Citium","dates":"c. 334–262 BCE","era":"Hellenistic Greece","school":"Stoicism","portrait":"Z","intro":"Zeno of Citium founded the Stoic school in Athens. His original works are lost, so Stoicism must be reconstructed from later Stoics and doxographical sources. The early Stoic system joined logic, physics and ethics into one picture of rationally ordered nature.","body":[["A unified system","Stoics divided philosophy into logic, physics and ethics, but treated them as interconnected. How we reason affects how we understand nature, and how we understand nature affects how we understand the good life."],["Living according to nature","Stoic ethics aims at living according to nature. This means aligning judgment and action with a rational understanding of what humans are and of the larger causal order they inhabit."],["Virtue as sufficient","Early Stoics held that virtue is sufficient for happiness. Wealth, health and reputation can be preferred or dispreferred, but they do not determine whether a person is morally excellent."],["Emotions","Stoic theory analyzes passions as judgments involving mistaken evaluations. This is more sophisticated than the stereotype that Stoics simply 'feel nothing.'"],["Cosmopolitanism","Stoic physics supported a picture of a rationally ordered cosmos in which human beings participate in a common rational nature. This becomes a basis for universal moral concern."],["Primary texts to know","Early Stoic writings are lost; fragments and reports are preserved through later authors such as Cicero, Seneca, Epictetus and Marcus Aurelius."],["A serious objection","Later Roman Stoics do not reproduce Zeno's system exactly. Do not assume that every later Stoic claim is literally Zeno's own position."]]},{"id":"aquinas","name":"Thomas Aquinas","dates":"1225–1274","era":"Medieval Europe","school":"Scholasticism","portrait":"A","intro":"Thomas Aquinas was a Dominican theologian and philosopher whose work integrated Aristotelian philosophy with Christian theology. His writing addresses metaphysics, natural law, ethics, knowledge and the nature of God, often through carefully structured objections and replies.","body":[["Faith and reason","Aquinas distinguishes truths accessible through philosophical reasoning from revealed theological truths while arguing that reason and revelation ultimately cannot genuinely contradict one another."],["Being and causation","His metaphysics develops ideas about act and potency, essence and existence, and causal dependence. These concepts are used in arguments about how contingent beings relate to a necessary source of existence."],["The Five Ways","Aquinas presents five routes of reasoning toward God's existence. They begin from features of the world such as change, causation and contingency. They are not simply five versions of the modern 'first cause' argument."],["Natural law","Human practical reason can participate in an objective moral order. Natural-law ethics connects human flourishing, practical reasoning and moral norms."],["Method","Aquinas often states an objection in its strongest form before answering it. Learning from this structure is useful even if one rejects his conclusions: philosophical argument should anticipate the strongest opposing case."],["Primary texts to know","Summa Theologiae; Summa contra Gentiles; selected disputed questions and commentaries on Aristotle."],["A serious objection","Critics dispute whether causal arguments can establish the theological conclusions Aquinas draws, and later philosophers challenge his metaphysical framework itself."]]},{"id":"machiavelli","name":"Niccolò Machiavelli","dates":"1469–1527","era":"Renaissance Italy","school":"Political philosophy","portrait":"M","intro":"Machiavelli was a Florentine political thinker and civil servant whose writings analyze power, conflict, institutions and political survival. He is often reduced to a stereotype about manipulation, but his work is more deeply concerned with the gap between moral ideals and the realities of political action.","body":[["The political problem","Machiavelli asks what rulers and republics must actually do to preserve political order. He often begins with how people behave rather than how moral theory says they should behave."],["Virtù and fortuna","Virtù is not simply moral virtue. It refers to qualities such as initiative, judgment, adaptability and strength in responding to political circumstances. Fortuna represents contingency and forces outside one's control."],["Republics","The Discourses on Livy shows Machiavelli was not interested only in princes. He praises conflict under institutions when structured conflict prevents domination and encourages civic participation."],["Means and ends","Machiavelli is associated with the idea that political necessity can justify harsh actions. The exact claim is more complicated than the slogan 'the ends justify the means,' which is not a reliable summary of his texts."],["Why he matters","He helped establish a style of political analysis that treats institutions, incentives and power as objects of study in their own right."],["Primary texts to know","The Prince; Discourses on Livy; The Art of War; Florentine Histories."],["A serious objection","The Prince can be read as advice, irony, diagnosis or a deliberately provocative analysis; scholars disagree about its rhetorical purpose. Avoid treating one interpretation as settled fact."]]},{"id":"hobbes","name":"Thomas Hobbes","dates":"1588–1679","era":"17th-century England","school":"Social contract theory","portrait":"H","intro":"Thomas Hobbes developed a powerful account of political authority from a thought experiment about the state of nature. His philosophy connects human motivation, fear, conflict and political obligation in an attempt to explain why a stable sovereign authority might be necessary.","body":[["State of nature","Hobbes imagines people without a common authority capable of enforcing rules. Because individuals are vulnerable and uncertain about others' intentions, competition and insecurity can become pervasive."],["Equality and vulnerability","Hobbes does not need everyone to be equally strong. Rough equality in the ability to harm one another is enough to generate insecurity: even a weaker person can threaten a stronger one through planning or cooperation."],["The social contract","People authorize a common power to escape the insecurity of the state of nature. Political authority is therefore connected to a problem of mutual vulnerability rather than simply inherited tradition."],["Fear and obligation","Fear of violent death plays a major role in Hobbes's account. Political obedience is connected to the protection authority provides, though his theory also contains questions about when self-preservation can override obedience."],["Why he matters","Hobbes transforms political philosophy by making the legitimacy of authority something that can be reconstructed from a model of human interaction rather than assumed from tradition."],["Primary texts to know","Leviathan; De Cive; The Elements of Law."],["A serious objection","Critics argue that Hobbes's picture of human motivation is too pessimistic or that his sovereign becomes too powerful. Later contract theories revise the problem in very different directions."]]},{"id":"locke","name":"John Locke","dates":"1632–1704","era":"17th-century England","school":"Empiricism / liberal political philosophy","portrait":"L","intro":"John Locke wrote influential works on knowledge, personal identity, government and religious toleration. He argues that much of our knowledge arises through experience and that legitimate political authority is constrained by rights and consent.","body":[["Ideas and experience","Locke rejects the idea that the mind contains a complete stock of innate ideas. Simple ideas arise through sensation and reflection, and the mind combines them into more complex ideas."],["Primary and secondary qualities","Locke distinguishes features such as shape and motion from qualities such as color or taste, which depend more directly on interaction with perceivers. The distinction influenced later debates about perception."],["Personal identity","Locke separates identity of a substance from personal identity and emphasizes consciousness and memory. This raises difficult cases about whether remembering an action is necessary or sufficient for being the same person."],["Political authority","Locke grounds legitimate government in consent and the protection of natural rights. Government is not simply entitled to rule because it possesses power."],["Resistance","If government systematically violates the purposes for which political authority exists, Locke's theory allows a right of resistance. This became important in later liberal political thought."],["Primary texts to know","An Essay Concerning Human Understanding; Two Treatises of Government; A Letter Concerning Toleration."],["A serious objection","Critics question Locke's theory of consent, the practical meaning of tacit consent, and the historical exclusions present in the political world in which his theory developed."]]},{"id":"berkeley","name":"George Berkeley","dates":"1685–1753","era":"18th-century Ireland","school":"Idealism","portrait":"B","intro":"George Berkeley developed an immaterialist philosophy arguing that physical objects should not be understood as mind-independent material substances existing exactly as common sense imagines. His project is partly an attempt to avoid skepticism about a world supposedly hidden behind perceptions.","body":[["To be is to be perceived","Berkeley's famous formula is commonly rendered as esse est percipi. Ordinary objects are collections of sensible qualities, and sensible qualities exist as perceived rather than as unknowable material substrates behind perception."],["Against material substance","Berkeley argues that the notion of a material substance existing entirely independent of perception is obscure. If all we ever encounter are ideas, why posit an unknowable material support behind them?"],["Objects when unseen","Berkeley's view does not mean your desk disappears when you leave. God guarantees the stability and order of ideas, according to his system."],["Anti-skeptical ambition","Berkeley thinks immaterialism can protect common-sense experience from skepticism: instead of an unknown material world behind appearances, reality is directly encountered as ideas and spirits."],["Why he matters","Berkeley forces a sharp distinction between what is perceived and what is inferred, and makes the philosophy of perception impossible to ignore."],["Primary texts to know","A Treatise Concerning the Principles of Human Knowledge; Three Dialogues between Hylas and Philonous."],["A serious objection","Many philosophers reject Berkeley's theological solution to object permanence. His arguments also depend on controversial assumptions about what perception gives us."]]},{"id":"spinoza","name":"Baruch Spinoza","dates":"1632–1677","era":"17th-century Dutch Republic","school":"Rationalism","portrait":"S","intro":"Baruch Spinoza developed a rigorous metaphysical system in which there is one infinite substance, which he calls God or Nature. His ethics connects human freedom with understanding necessity, and his political writings defend freedom of thought and expression.","body":[["One substance","Spinoza argues that there cannot be multiple independent substances in the ordinary sense. Everything follows within one infinite reality, expressed through attributes such as thought and extension."],["God or Nature","Deus sive Natura—God or Nature—does not describe a personal deity standing outside the world. Spinoza identifies God with the necessary order of reality itself."],["Necessity","Events follow from the nature of reality. Human beings often feel free because they are conscious of desires but ignorant of the causes determining them."],["Freedom","Spinozistic freedom is not uncaused choice. It is increasing activity and understanding: the more adequately we understand causes and act from our own rational nature, the less passively we are driven by external forces."],["Ethics","Spinoza analyzes emotions as natural phenomena. Understanding desire and affect can transform how we relate to them instead of treating them as mysterious moral failures."],["Primary texts to know","Ethics; Theological-Political Treatise; Treatise on the Emendation of the Intellect."],["A serious objection","Critics debate whether Spinoza's monism leaves room for genuine individuality, contingency or moral responsibility. His definition of freedom differs sharply from ordinary libertarian free will."]]},{"id":"leibniz","name":"Gottfried Wilhelm Leibniz","dates":"1646–1716","era":"17th-century Europe","school":"Rationalism","portrait":"L","intro":"Leibniz was a philosopher, mathematician and logician who developed a metaphysics of monads, possible worlds and sufficient reason. His work seeks to explain individuality and order while preserving a strong principle that reality is intelligible.","body":[["Sufficient reason","Leibniz argues that nothing happens without a sufficient reason why it is so rather than otherwise. The principle drives his search for explanations beyond brute fact."],["Monads","Monads are simple, non-extended centers of perception or activity. They do not causally push one another around; instead, their states unfold according to their own internal principles within a pre-established harmony."],["Possible worlds","Leibniz imagines alternative complete ways reality could have been. God's choice of the actual world is therefore discussed against a space of possibilities."],["Identity and individuation","Leibniz's principle of the identity of indiscernibles says that there cannot be two genuinely distinct things sharing every property. This links metaphysics to questions about what makes individuals different."],["Mind and perception","Even simple entities have some form of representation, though not all perceptions are conscious. This gives Leibniz a layered picture of mental life."],["Primary texts to know","Monadology; Discourse on Metaphysics; New Essays on Human Understanding; Theodicy."],["A serious objection","The pre-established harmony can appear to replace causal interaction with coordination. Critics also challenge whether possible-world reasoning can establish claims about the actual world."]]},{"id":"rousseau","name":"Jean-Jacques Rousseau","dates":"1712–1778","era":"18th-century Europe","school":"Political philosophy","portrait":"R","intro":"Jean-Jacques Rousseau examined inequality, freedom, education and political legitimacy. His writings ask how human beings can live together without turning social dependence into domination, and they deeply influenced modern ideas about citizenship and education.","body":[["Natural freedom","Rousseau distinguishes the human condition before complex social institutions from the social world people actually inhabit. His 'state of nature' is a philosophical model, not straightforward anthropology."],["Inequality","He argues that social inequalities can become entrenched through institutions, comparison and property. The problem is not every difference between people but the creation of relations in which some can dominate others."],["The social contract","Legitimate political order must reconcile individual freedom with collective authority. Rousseau's general will is meant to express the common political interest, not simply the sum of everyone's private preferences."],["Education","Emile presents an educational theory centered on development rather than forcing children prematurely into adult social expectations. It remains influential and controversial."],["Why he matters","Rousseau helps frame a modern problem: how can people remain free while living under common rules? Later democratic and revolutionary traditions answer that question in sharply different ways."],["Primary texts to know","Discourse on the Origin of Inequality; The Social Contract; Emile; Confessions."],["A serious objection","The general will can be interpreted in authoritarian ways, and Rousseau's theory of natural humanity is highly speculative. His political theory has generated sharply different readings."]]},{"id":"bentham","name":"Jeremy Bentham","dates":"1748–1832","era":"18th–19th-century Britain","school":"Utilitarianism","portrait":"B","intro":"Jeremy Bentham developed an early systematic form of utilitarianism. He evaluates laws and actions by their effects on pleasure and pain and argues that institutions should be judged by how they affect human welfare rather than by inherited privilege.","body":[["Utility","Bentham's principle of utility asks whether an action or policy tends to increase or decrease happiness. Moral evaluation is therefore connected to consequences rather than intentions alone."],["The felicific calculus","Bentham proposed dimensions such as intensity, duration, certainty and extent for thinking systematically about pleasures and pains. It is an ambitious attempt to make moral reasoning more explicit."],["Equal consideration","Bentham's framework does not give moral weight merely because someone is socially prestigious. The interests of each person count in the calculation."],["Law and reform","Utilitarianism becomes a tool for evaluating punishment, legislation and social institutions. Bentham's philosophy is practical and reform-oriented."],["Criticism","Critics worry that aggregating welfare can permit sacrificing an individual for a larger total. Others question whether all values can be reduced to pleasure and pain."],["Primary texts to know","An Introduction to the Principles of Morals and Legislation; Panopticon writings; Constitutional Code."],["A serious objection","Later utilitarians modify Bentham's hedonism and develop stronger accounts of rights, rules and qualitative differences between goods."]]},{"id":"mill","name":"John Stuart Mill","dates":"1806–1873","era":"19th-century Britain","school":"Utilitarianism / liberalism","portrait":"M","intro":"John Stuart Mill developed utilitarianism, political liberalism and arguments for individuality, free expression and women's equality. His work combines consequentialist ethics with a strong concern for the social conditions that allow human development.","body":[["Higher and lower pleasures","Mill argues that pleasures differ in quality as well as quantity. Competent judges who know both kinds of experience can prefer intellectual and artistic activities even when they involve difficulty."],["The harm principle","In On Liberty, Mill argues that coercion against adults requires a justification connected to preventing harm to others. He distinguishes harm from mere offense or moral disapproval."],["Free expression","Mill defends freedom of discussion partly because a suppressed opinion might be true, partly because a false opinion can force people to understand why the truth is true, and partly because unchallenged beliefs can become dead dogma."],["Individuality","A flourishing society needs room for experiments in living. Conformity can suppress forms of development that benefit both individuals and society."],["Women and equality","The Subjection of Women argues that legal and social restrictions on women cannot be justified by appeals to supposed natural inferiority when social conditions themselves have shaped observed differences."],["Primary texts to know","Utilitarianism; On Liberty; The Subjection of Women; Considerations on Representative Government."],["A serious objection","Critics debate the limits of the harm principle, the coherence of higher pleasures, and whether utilitarian reasoning can adequately protect individual rights."]]},{"id":"kierkegaard","name":"Søren Kierkegaard","dates":"1813–1855","era":"19th-century Denmark","school":"Existential philosophy","portrait":"K","intro":"Søren Kierkegaard explored anxiety, despair, faith, individuality and the difficulty of becoming a self. He often wrote through pseudonymous voices rather than presenting a single systematic doctrine, making the reader part of the philosophical problem.","body":[["The individual","Kierkegaard worries that abstract systems can describe humanity while ignoring the concrete individual who must actually choose and live. Philosophy therefore has an existential dimension: what does an idea demand of me?"],["Either/or","Different modes of life—often represented as aesthetic, ethical and religious—are explored through literary and philosophical voices. The point is not a simple checklist but a problem of commitment."],["Anxiety","Anxiety arises from the possibility of freedom. When many possibilities are open, the individual confronts responsibility rather than simply reacting to necessity."],["Despair","Despair is a failure to become a self in a healthy relation to oneself. Kierkegaard analyzes forms of refusing to be oneself or refusing to accept oneself."],["Faith","Faith is not simply accepting a proposition because evidence is weak. Kierkegaard emphasizes commitment, risk and the relationship between the individual and the absolute."],["Primary texts to know","Either/Or; Fear and Trembling; The Concept of Anxiety; The Sickness Unto Death."],["A serious objection","Kierkegaard's religious commitments are central, but his analyses of anxiety, selfhood and choice can also be studied independently of accepting his theology."]]},{"id":"hegel","name":"G.W.F. Hegel","dates":"1770–1831","era":"19th-century Germany","school":"German Idealism","portrait":"H","intro":"Georg Wilhelm Friedrich Hegel developed a systematic philosophy of logic, history, society and spirit. His thought is difficult because concepts are treated as developing through internal tensions rather than as isolated definitions.","body":[["Dialectical development","Hegel examines how a position can contain tensions that push thought toward a more developed conception. The famous 'thesis-antithesis-synthesis' formula is a later simplification and should not be used as a substitute for reading Hegel."],["Recognition","In the master-slave discussion, self-consciousness is connected to recognition by another self-conscious being. The relation shows how social dependence can enter into the formation of identity."],["History","Hegel treats history as intelligible development rather than a random sequence. Human freedom becomes a central theme in the development of institutions and forms of self-understanding."],["Freedom and institutions","For Hegel, freedom is not simply doing whatever one wants. Ethical life involves institutions—family, civil society and political life—that structure the conditions under which freedom can be realized."],["Why he matters","Hegel strongly influenced Marx, existentialism, social theory and later continental philosophy. Understanding him helps explain why history and contradiction became central philosophical categories in the nineteenth century."],["Primary texts to know","Phenomenology of Spirit; Science of Logic; Philosophy of Right; Lectures on the Philosophy of History."],["A serious objection","Hegel's system is controversial. Critics dispute his conception of historical progress and whether dialectical development can justify the conclusions he draws."]]},{"id":"marx","name":"Karl Marx","dates":"1818–1883","era":"19th-century Europe","school":"Social and political philosophy","portrait":"M","intro":"Karl Marx analyzed capitalism, labor, class, ideology and historical change. His work combines philosophy with political economy and social criticism. Marx's concepts are frequently simplified into slogans, so learning his arguments requires distinguishing his own texts from later Marxist traditions.","body":[["Material conditions","Marx argues that social life cannot be understood only through ideas. How people produce, distribute and organize material life shapes institutions and forms of consciousness."],["Labor and alienation","In his early writings, Marx describes forms of alienation in which workers become separated from the products of labor, the activity itself, other people and aspects of human potential."],["Commodity and value","Capital analyzes commodities, labor and value in a detailed critique of political economy. The aim is not merely to say that capitalism is unfair but to uncover structures that make particular social relations appear natural."],["Class","Class is connected to people's positions within systems of production. Marx expects conflicts between classes to arise from opposing material interests, though historical developments are more complicated than a simple two-group model."],["Ideology","Ideology can describe forms of consciousness through which historically specific social relations appear natural, universal or inevitable. This makes critique partly a project of revealing hidden social structures."],["Primary texts to know","Economic and Philosophic Manuscripts of 1844; The German Ideology; Communist Manifesto; Capital, Volume I."],["A serious objection","Marx's predictions and historical claims are disputed, and later regimes calling themselves Marxist cannot simply be equated with Marx's texts. His critique of political economy also has multiple competing interpretations."]]},{"id":"millian","name":"Friedrich Nietzsche","dates":"1844–1900","era":"19th-century Europe","school":"Genealogical / existential philosophy","portrait":"N","intro":"Friedrich Nietzsche attacked inherited moral assumptions, traditional metaphysics and the cultural consequences of the decline of religious authority. He writes aphoristically, provocatively and from shifting perspectives, so slogans often hide the complexity of his arguments.","body":[["Critique of morality","Nietzsche asks where moral values came from and what psychological needs they serve. Genealogy changes the question from 'Is this value obviously true?' to 'What history and power relations helped produce it?'"],["Master and slave morality","In On the Genealogy of Morality, Nietzsche contrasts value systems associated with strength and affirmation with a reactive morality that condemns qualities it cannot possess. The argument is historical and psychological rather than a simple command to be cruel."],["Nihilism","Nihilism names a crisis in which inherited sources of value lose their authority. Nietzsche's project is not simply to celebrate meaninglessness but to investigate what could follow the collapse of inherited guarantees."],["Will to power","The will to power is a contested interpretive concept. It can be read as a drive toward expansion, interpretation, self-overcoming and organization rather than merely a desire to dominate other people."],["Self-overcoming","Nietzsche repeatedly asks what it would mean to create or transform values rather than passively inherit them. This is connected to his ideal of overcoming one's own limitations."],["Primary texts to know","Beyond Good and Evil; On the Genealogy of Morality; Thus Spoke Zarathustra; The Gay Science; Twilight of the Idols."],["A serious objection","Nietzsche's style makes selective quotation dangerous. He uses irony, masks and deliberate provocation, and scholars disagree about how different passages fit together."]]},{"id":"debeauvoir","name":"Simone de Beauvoir","dates":"1908–1986","era":"20th-century France","school":"Existentialism / feminist philosophy","portrait":"B","intro":"Simone de Beauvoir was a philosopher, writer and social critic whose work connects existential freedom with the concrete social conditions in which people live. She analyzed women's oppression, ambiguity, embodiment, ethics and the ways societies construct gendered roles.","body":[["Situated freedom","Freedom is real but never exercised from nowhere. People act within bodies, histories, economic conditions and social expectations. Beauvoir therefore resists both total determinism and a fantasy of unlimited individual choice."],["Becoming a social category","The Second Sex analyzes how women are positioned as the 'Other' relative to a male norm. The famous idea that one becomes rather than simply is a woman concerns social formation, not a denial of biological bodies."],["Immanence and transcendence","Beauvoir contrasts being confined to repetitive, closed roles with projects that open possibilities through action. Oppression can restrict someone's ability to pursue meaningful projects."],["Ethics of ambiguity","Human beings are both free and situated, both subjects and objects. An ethical life must acknowledge this ambiguity rather than pretending either that freedom is absolute or that responsibility disappears."],["Why she matters","Beauvoir connects existential questions about freedom and selfhood with institutions, embodiment and gendered social structures, influencing later feminist philosophy and social theory."],["Primary texts to know","The Second Sex; The Ethics of Ambiguity; Pyrrhus and Cineas; She Came to Stay."],["A serious objection","Beauvoir's categories have been challenged and developed by later feminist thinkers, including intersectional approaches that emphasize race, class, sexuality, disability and colonial history."]]},{"id":"husserl","name":"Edmund Husserl","dates":"1859–1938","era":"20th-century Europe","school":"Phenomenology","portrait":"H","intro":"Edmund Husserl founded phenomenology as a rigorous investigation of consciousness and experience. He wanted philosophy to examine how things are given to consciousness before prematurely imposing metaphysical theories about what exists independently of experience.","body":[["Intentionality","Consciousness is intentional: it is consciousness of something. Perceiving, remembering, imagining and judging are directed toward objects in different ways."],["Epoché","The phenomenological epoché brackets ordinary assumptions about the independent existence of things so that the philosopher can investigate how they are experienced. It is not simply denying the external world."],["Phenomenological reduction","Reduction redirects attention toward structures of experience and the ways objects are constituted as meaningful. Husserl's method changes across his writings, so there is no single easy formula."],["Lifeworld","Later Husserl emphasizes the Lebenswelt, the lived world of everyday experience that scientific abstractions presuppose. This becomes important for later critiques of overly detached accounts of knowledge."],["Influence","Heidegger, Merleau-Ponty, Sartre and many others transform phenomenology in different directions."],["Primary texts to know","Logical Investigations; Ideas; Cartesian Meditations; The Crisis of European Sciences and Transcendental Phenomenology."],["A serious objection","Critics debate whether phenomenological reduction can really bracket metaphysical assumptions and whether Husserl's transcendental framework overstates the role of consciousness."]]},{"id":"heidegger","name":"Martin Heidegger","dates":"1889–1976","era":"20th-century Germany","school":"Phenomenology / ontology","portrait":"H","intro":"Martin Heidegger transformed phenomenology into a fundamental inquiry into Being, existence, temporality and everyday life. His philosophy is difficult and his political involvement with Nazism is historically documented; studying his ideas requires keeping the philosophical texts and the historical record distinct.","body":[["The question of Being","Heidegger distinguishes the question of what particular things are from the more basic question of what it means for beings to be at all. He argues that Western philosophy often forgets this question."],["Dasein","Dasein names the kind of being for whom Being is an issue. Heidegger analyzes human existence through concepts such as being-in-the-world, care and temporality rather than treating the mind as a detached spectator."],["The They","Everyday life is shaped by das Man—the anonymous 'They' of social expectations. People can drift into conventional ways of speaking and acting without actively owning their possibilities."],["Authenticity","Authenticity is not simply being quirky or independent. It involves owning one's finite possibilities rather than allowing anonymous social norms to completely determine one's understanding of existence."],["Being-toward-death","Mortality reveals that one's possibilities are finite and cannot simply be postponed forever. Death therefore has an existential significance beyond being a biological event."],["Primary texts to know","Being and Time; The Basic Problems of Phenomenology; The Question Concerning Technology."],["A serious objection","Heidegger's Nazi involvement and later statements remain historically and ethically important. His concepts are also criticized for obscurity, political implications and difficult claims about modernity and technology."]]},{"id":"arendt","name":"Hannah Arendt","dates":"1906–1975","era":"20th-century Europe / United States","school":"Political philosophy","portrait":"A","intro":"Hannah Arendt analyzed totalitarianism, revolution, political action, judgment and the human condition. She distinguishes different forms of human activity and emphasizes the public world in which people appear to one another through speech and action.","body":[["The human condition","Arendt distinguishes labor, work and action. Labor sustains biological life; work creates a durable human world; action occurs among people and reveals who they are through speech and deeds."],["Plurality","Politics exists because humans are plural: different people inhabit a shared world from different perspectives. Political freedom therefore cannot be reduced to private choice alone."],["Totalitarianism","Arendt analyzes totalitarian movements through ideology, terror, atomization and the destruction of independent political spaces. Her account is historical and conceptual rather than a generic theory of dictatorship."],["The banality of evil","Arendt's phrase refers to the possibility that terrible wrongdoing can be carried out by ordinary people who fail to think critically about what they are doing. It is not the claim that evil acts are trivial."],["Judgment","Arendt becomes increasingly interested in judgment: the capacity to think from a plurality of perspectives without pretending that every perspective is equally correct."],["Primary texts to know","The Origins of Totalitarianism; The Human Condition; Eichmann in Jerusalem; Between Past and Future; On Revolution."],["A serious objection","Arendt's account of Eichmann and her concept of the banality of evil have been heavily debated by historians and philosophers, especially regarding how much they explain about Nazi perpetrators."]]},{"id":"foucault","name":"Michel Foucault","dates":"1926–1984","era":"20th-century France","school":"Genealogy / social philosophy","portrait":"F","intro":"Michel Foucault investigated the historical formation of knowledge, institutions, norms and forms of power. Rather than treating power only as something a government possesses, he examined how practices such as medicine, punishment and sexuality organize what people can say, do and become.","body":[["Power and knowledge","Foucault argues that power and knowledge are deeply intertwined. Institutions classify, measure and normalize people, while these forms of knowledge can simultaneously support institutional power."],["Discipline","In Discipline and Punish, prisons become a case study for disciplinary power: surveillance, examination and normalization can shape behavior even when direct force is not constantly applied."],["Genealogy","Genealogy investigates the contingent historical development of practices and categories. It asks how things that now seem natural or inevitable became authoritative."],["Biopower","Foucault uses biopower to analyze forms of power concerned with regulating populations—health, birth, mortality, public hygiene and related processes."],["Subject formation","Power is not merely external repression. People can become subjects through categories, norms and practices that shape how they understand themselves."],["Primary texts to know","Madness and Civilization; The Birth of the Clinic; Discipline and Punish; The History of Sexuality, Vol. 1."],["A serious objection","Critics argue that Foucault sometimes makes resistance and normative evaluation difficult to ground. His historical claims also require careful checking against specific archives rather than being treated as universal laws."]]},{"id":"popper","name":"Karl Popper","dates":"1902–1994","era":"20th-century Austria / Britain","school":"Philosophy of science","portrait":"P","intro":"Karl Popper argued that scientific theories should be exposed to severe attempts at refutation rather than treated as conclusively verified. He also applied ideas about critical rationalism to political institutions and warned against historical theories that claim to predict inevitable social development.","body":[["Falsifiability","Popper's demarcation idea says a scientific theory should make risky claims that could, in principle, conflict with observation. A theory that can explain every possible outcome may not be genuinely testable."],["Conjectures and refutations","Science advances through proposing hypotheses and attempting to find errors. Surviving criticism does not make a theory finally true; it means it has not yet been refuted under the tests applied."],["Against induction","Popper rejects the idea that science needs inductive confirmation as its logical foundation. Instead, theories are conjectures tested deductively against consequences."],["Critical rationalism","Reasonable belief requires openness to criticism. This becomes a general epistemic attitude rather than a claim that humans can eliminate error."],["Open society","In political philosophy, Popper favors institutions that allow peaceful criticism and correction rather than systems that claim historical certainty and suppress dissent."],["Primary texts to know","The Logic of Scientific Discovery; Conjectures and Refutations; The Open Society and Its Enemies."],["A serious objection","Scientists often use confirmation, probabilistic reasoning and model comparison in ways that are not captured by a simple falsification picture. Popper's demarcation criterion remains influential but contested."]]},{"id":"quine","name":"W.V.O. Quine","dates":"1908–2000","era":"20th-century United States","school":"Analytic philosophy","portrait":"Q","intro":"Willard Van Orman Quine challenged sharp distinctions between analytic and synthetic truths and argued for a holistic picture of how beliefs face experience. His work influenced philosophy of language, logic, epistemology and naturalized philosophy.","body":[["Two dogmas","Quine attacks the analytic/synthetic distinction and reductionism—the idea that each meaningful statement can be reduced to a set of immediate experiences. He argues that beliefs face experience as interconnected networks."],["Web of belief","A person's beliefs form a network. When experience conflicts with the network, there are many possible revisions; we do not always abandon the single statement that seems closest to the observation."],["Naturalized epistemology","Quine proposes that epistemology should engage with empirical science rather than seeking an impossible foundation completely prior to science."],["Indeterminacy of translation","Quine argues that available behavioral evidence may underdetermine which translation manual is uniquely correct. This challenges simple pictures of fixed meanings hidden inside words."],["Why he matters","Quine helped reshape analytic philosophy by connecting logic and language with empirical inquiry and by questioning the boundaries between philosophy and science."],["Primary texts to know","Two Dogmas of Empiricism; Word and Object; From a Logical Point of View; Epistemology Naturalized."],["A serious objection","Critics dispute whether Quine's naturalization gives up too much of philosophy's normative role and whether his indeterminacy thesis proves the radical conclusions sometimes attributed to it."]]},{"id":"peirce","name":"Charles Sanders Peirce","dates":"1839–1914","era":"19th-century United States","school":"Pragmatism / logic","portrait":"P","intro":"Charles Sanders Peirce was a logician, scientist and philosopher who developed pragmatism, semiotics and a theory of inquiry. He treated beliefs as habits of action and saw inquiry as a social process capable of correcting error over time.","body":[["Pragmatic maxim","To understand the meaning of a concept, examine what practical differences would follow if it were true. Meaning is connected to conceivable consequences rather than a hidden metaphysical picture alone."],["Inquiry","Inquiry begins with doubt that disrupts established habits and moves toward a more stable belief. Peirce rejects private certainty as the final goal; inquiry is potentially communal and self-correcting."],["Signs","Peirce develops a sophisticated semiotics in which signs stand for objects to interpreters. His classifications of icon, index and symbol remain influential in language and communication studies."],["Fallibilism","Any belief can in principle be mistaken. This does not mean all beliefs are equally doubtful; it means knowledge remains open to correction."],["Abduction","Peirce distinguishes deduction, induction and abduction. Abduction is reasoning toward a plausible explanatory hypothesis—the 'guess' that makes a surprising fact intelligible."],["Primary texts to know","The Fixation of Belief; How to Make Our Ideas Clear; selected Collected Papers and manuscripts."],["A serious objection","Pragmatism is sometimes reduced to 'whatever works.' Peirce's account is more demanding: practical consequences, inquiry, signs and communal criticism constrain what counts as a good belief."]]},{"id":"william_james","name":"William James","dates":"1842–1910","era":"19th-century United States","school":"Pragmatism / psychology","portrait":"J","intro":"William James was a philosopher and psychologist who developed pragmatism and wrote extensively about consciousness, religious experience, habit and pluralism. He treats lived experience as philosophically significant without reducing philosophy to private feeling.","body":[["Pragmatism","James asks what practical difference a belief makes. The truth of a belief is connected to how it proves itself in experience and inquiry, not to a purely static correspondence picture."],["Stream of consciousness","James describes consciousness as a continuous flow rather than a sequence of isolated mental objects. This influenced psychology and later philosophy of mind."],["The will to believe","James argues that in certain forced, live and momentous choices, waiting for decisive evidence can itself amount to a practical decision. The essay is often misunderstood as a general license to believe without evidence."],["Pluralism","James resists the idea that one total philosophical system must capture every aspect of experience. Reality may be richer and more plural than a single abstract scheme suggests."],["Radical empiricism","James wants philosophy to take relations, feelings and experienced structures seriously rather than treating only discrete physical objects as real data."],["Primary texts to know","Pragmatism; The Varieties of Religious Experience; The Principles of Psychology; Essays in Radical Empiricism."],["A serious objection","Critics question whether pragmatic success can distinguish truth from merely useful belief, and whether James's account of religious belief gives sufficient weight to evidential standards."]]},{"id":"nozick","name":"Robert Nozick","dates":"1938–2002","era":"20th-century United States","school":"Political philosophy","portrait":"N","intro":"Robert Nozick defended a rights-based libertarian political philosophy in Anarchy, State, and Utopia. He challenges patterned theories of distributive justice by asking whether people have rights over themselves and their holdings and whether those rights constrain redistribution.","body":[["Self-ownership","Nozick's framework gives individuals strong rights over themselves and their labor. Political institutions must justify interference with those rights rather than assume redistribution is automatically permissible."],["Entitlement theory","A distribution is just if it arises from just acquisition, just transfer and correction of past injustice. The pattern of the final distribution is not enough by itself."],["Wilt Chamberlain example","Nozick imagines people voluntarily paying a popular athlete small amounts, producing a new unequal distribution. The example is designed to challenge the idea that maintaining a preferred pattern can avoid constant interference with voluntary exchanges."],["Minimal state","Nozick argues that a limited state protecting against force, theft and fraud can be morally justified, while more extensive redistributive states face a serious rights objection."],["Why he matters","Nozick provides a major challenge to Rawlsian and other egalitarian approaches and makes individual rights central to distributive justice."],["Primary texts to know","Anarchy, State, and Utopia."],["A serious objection","Critics challenge Nozick's historical acquisition principle, the treatment of background injustice, and the assumption that voluntary exchange occurs against a morally acceptable starting distribution."]]}];

function philosophers(){
 document.getElementById("view").innerHTML=`<div class="card"><div class="kicker">People</div><h2>Philosophers</h2><p class="muted">This is a real library: click a person to open their full entry.</p><input class="search" id="psearch" placeholder="Search philosopher, era or school..." oninput="filterP()"><div class="grid" id="plist">${P.map(personCard).join("")}</div></div>`
}
function personCard(p){
 return `<div class="card clickable" onclick="go('person','${p.id}')"><div class="personhead">${svgPortrait(p)}<div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.dates)}<br>${esc(p.era)}</div></div></div><div style="margin-top:10px"><span class="tag">${esc(p.school)}</span></div><p>${esc(p.intro.slice(0,180))}…</p></div>`
}
function filterP(){let q=document.getElementById("psearch").value.toLowerCase();document.getElementById("plist").innerHTML=P.filter(p=>(p.name+" "+p.dates+" "+p.era+" "+p.school+" "+p.intro).toLowerCase().includes(q)).map(personCard).join("")||'<div class="empty">No philosopher found.</div>'}
function person(id){
 const p=P.find(x=>x.id===id);if(!p)return philosophers();
 const key='note_'+p.id; const note=localStorage.getItem(key)||''; const mastered=!!state.mastery?.[p.id];
 document.getElementById("view").innerHTML=`<div class="back"><button class="btn secondary" onclick="go('philosophers')">← All philosophers</button></div><div class="two"><article class="card reading"><div class="personhead">${svgPortrait(p)}<div><div class="kicker">${esc(p.era)}</div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.dates)} · ${esc(p.school)}</p></div></div><div class="quote"><b>Who is this?</b><br>${esc(p.intro)}</div><div class="studytools"><button class="smallbtn ${mastered?'on':''}" onclick="toggleMastery('${p.id}')">${mastered?'✓ Mastered':'Mark mastered'}</button><button class="smallbtn" onclick="saveNote('${p.id}')">Save notes</button><button class="smallbtn" onclick="flashFromPerson('${p.id}')">Flashcard</button></div>${p.body.map(([h,t])=>`<h2>${esc(h)}</h2><p>${glossary(t)}</p>`).join("")}<div class="depth"><h2>Your notes</h2><textarea class="notearea" id="noteBox" placeholder="Write your own explanation, objections, connections, or questions...">${esc(note)}</textarea></div></article><aside class="card side"><div class="kicker">Study this person</div><h3>Active recall</h3><p class="muted">1. Explain their central problem without looking.</p><p class="muted">2. State their strongest argument in your own words.</p><p class="muted">3. Give the strongest objection you can.</p><p class="muted">4. Compare them with one philosopher who disagrees.</p><button class="btn secondary" onclick="go('quiz')">Test yourself</button><div class="notice"><b>Do not memorize the summary.</b><br>Close the page and reconstruct the argument from memory. Then return and check what you missed.</div></aside></div>`
}

function ideas(){
 document.getElementById("view").innerHTML=`<div class="card"><div class="kicker">Concepts</div><h2>Ideas & Concepts</h2><p class="muted">Click any idea. These are written as study entries, not just dictionary definitions.</p><input class="search" id="isearch" placeholder="Search concepts or questions..." oninput="filterI()"><div class="grid" id="ilist">${I.map(ideaCard).join("")}</div></div>`

function idea(id){
 const x=I.find(a=>a[0]===id);if(!x)return ideas();
 const related=P.filter(p=>(p.intro+" "+p.body.flat().join(" ")).toLowerCase().includes(id.toLowerCase())).slice(0,6);

 document.getElementById("view").innerHTML=`<div class="card reading"><div class="kicker">Historical map</div><h2>History of Philosophy</h2><p>Philosophy is easier to understand when you see problems moving from one generation to another. The timeline below is a map, not a claim that every philosopher fits neatly into one box.</p><div class="timeline">${HISTORY.map((h,i)=>`<div class="timeline-item"><div class="kicker">${esc(h[1])}</div><h3>${i+1}. ${esc(h[0])}</h3><p>${glossary(h[2])}</p></div>`).join("")}</div></div>`

 currentQuiz=0;score=0;answered=false;showQ();

function answer(i){
 if(answered)return;answered=true;let q=QUIZ[currentQuiz];if(i===q[2])score++;state.answers++;save();document.querySelectorAll(".option").forEach((b,j)=>{if(j===q[2])b.classList.add("correct");if(j===i&&i!==q[2])b.classList.add("wrong")});document.getElementById("qfeedback").innerHTML=`<div class="notice"><b>${i===q[2]?"Correct.":"Not quite."}</b><br>${esc(q[3])}</div><button class="btn" onclick="nextQ()">${currentQuiz===QUIZ.length-1?"Finish":"Next question"}</button>`

ition","Social","Recognition","The idea that social identities and self-relations depend partly on being acknowledged by others.","Hegel; Honneth; Taylor"],["discipline","Social","Discipline","Foucault’s term for modern techniques that organize bodies, time, space and conduct through surveillance, normalization and training.","Foucault"],["biopolitics","Social","Biopolitics","A concept associated with Foucault for forms of power concerned with managing populations, life processes and biological characteristics.","Foucault"],["social-construction","Social","Social construction","The claim that some categories or practices depend substantially on social norms, institutions and historical arrangements rather than being fixed by nature alone.","Berger & Luckmann; Butler; Foucault"],["alienation-concept","Social","Alienation","A condition of estrangement from one’s activity, products, social relations or human capacities; central to Marx’s early critique of labor.","Marx"],["commodity-fetishism","Social","Commodity fetishism","Marx’s analysis of how social relations among producers can appear as relations among things in commodity exchange.","Marx"],["historical-materialism","Social","Historical materialism","A framework emphasizing material production, social relations and conflict in explaining historical transformation.","Marx; Engels"],["language-game","Language","Language-game","Wittgenstein’s term for a practice in which words have meaning through their use within activities and forms of life.","Wittgenstein"],["private-language","Language","Private-language argument","Wittgenstein’s argument challenging the idea of a language whose meaningful criteria are accessible only to a single individual.","Wittgenstein"],["speech-act","Language","Speech act","An utterance can do something—promise, order, apologize, declare—rather than merely describe a state of affairs.","Austin; Searle"],["reference","Language","Reference","The relation by which an expression is used to pick out or stand for an object, entity or value.","Frege; Russell; Kripke"],["meaning-use","Language","Meaning as use","The later Wittgensteinian idea that understanding a word involves knowing how it functions within human practices.","Wittgenstein"],["categorical-imperative","Ethics","Categorical imperative","Kant’s family of formulations for moral obligation, including universal law and treating humanity as an end rather than merely as a means.","Kant"],["hypothetical-imperative","Ethics","Hypothetical imperative","A practical command that applies conditionally: if you want an end, take the means required for it.","Kant"],["veil-ignorance","Political","Veil of ignorance","Rawls’s device of preventing parties choosing principles of justice from knowing their future social position.","Rawls"],["original-position","Political","Original position","Rawls’s hypothetical decision situation for modeling impartial choice of principles of justice.","Rawls"],["difference-principle","Political","Difference principle","Rawls’s principle concerning inequalities: social and economic inequalities must be arranged to the greatest benefit of the least advantaged under fair conditions.","Rawls"],["minimal-state","Political","Minimal state","Nozick’s conception of a state limited largely to protection against force, theft, fraud and enforcement of contracts.","Nozick"],["harm-principle","Political","Harm principle","Mill’s claim that coercion against an individual is justified to prevent harm to others, rather than simply to enforce morality or benefit the person.","Mill"],["general-will","Political","General will","Rousseau’s concept of a collective political will oriented toward the common good rather than the aggregation of private interests.","Rousseau"],["state-of-nature","Political","State of nature","A hypothetical pre-political condition used by social-contract theorists to investigate why political authority might be needed or legitimate.","Hobbes; Locke; Rousseau"],["eterna
