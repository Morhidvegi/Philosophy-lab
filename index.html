<script>
const P = [
{id:"socrates",name:"Socrates",dates:"c. 470–399 BCE",era:"Ancient Greece",school:"Socratic philosophy",portrait:"S",intro:"Socrates was an Athenian philosopher famous for turning ordinary conversations into investigations of concepts such as justice, courage, piety and knowledge. He left no writings of his own, so our picture of him comes mainly from later sources, especially Plato and Xenophon. This makes Socrates himself partly a historical puzzle.",body:[
["The person","Socrates lived in Athens during a period of political upheaval and intellectual experimentation. He spent much of his time speaking with citizens, politicians and other thinkers. Rather than presenting himself as a teacher who possessed a complete doctrine, he often presented himself as someone trying to discover what could actually be defended."],
["The Socratic method","A typical Socratic exchange starts with a confident definition: 'justice is helping your friends,' for example. Socrates then asks questions that test the definition against other cases. If the definition produces a contradiction, the participants have reached aporia—a state of puzzlement. The puzzlement is valuable because it exposes false confidence."],
["Knowledge and humility","Socrates is associated with the idea that recognizing one's ignorance is philosophically important. The point is not that nobody can know anything. It is that claiming knowledge without understanding its reasons is dangerous. Philosophy therefore becomes an activity of examination rather than a collection of answers."],
["Ethics","Socrates repeatedly treats the condition of the soul or character as more important than wealth, reputation or political status. The central question becomes not simply 'What can I get?' but 'What sort of person am I becoming?'"],
["Why he matters","Socrates helped make philosophical dialogue, conceptual analysis and the examination of one's life central practices of Western philosophy. Later philosophers repeatedly return to his basic challenge: do you actually understand the words you use to describe what is good, true or just?"]]},
{id:"plato",name:"Plato",dates:"c. 428–348 BCE",era:"Ancient Greece",school:"Platonism",portrait:"P",intro:"Plato was an Athenian philosopher and student of Socrates. He founded the Academy and wrote philosophical dialogues that became foundational texts of Western philosophy. His work ranges from metaphysics and epistemology to ethics, politics, mathematics, education and love.",body:[
["The Forms","Plato is famous for the theory of Forms. Physical objects change and are imperfect: drawn circles are never mathematically perfect, for example. Plato's Forms are stable intelligible realities that provide standards by which imperfect instances can be understood. The theory is complex and changes across his dialogues, so it is better treated as a family of connected arguments than a single simple doctrine."],
["The Cave","In the Allegory of the Cave, prisoners mistake shadows for reality because they have never seen anything else. Education is represented as a difficult turning of the whole person toward what is intelligible. The image raises a question that still matters: how can someone distinguish genuine understanding from a convincing appearance?"],
["Knowledge","Plato distinguishes opinion from knowledge and asks what makes knowledge stable and justified. Mathematics becomes an important model because mathematical objects appear more stable than sensory objects. The dialogues repeatedly test whether perception alone can give us the kind of certainty philosophy seeks."],
["Justice and politics","The Republic asks what justice is in an individual and in a city. Plato connects political order with education and the structure of the soul. His political proposals are controversial, but the deeper philosophical problem is enduring: what kind of knowledge, character and institutions are required for a just society?"],
["Why he matters","Plato established a model in which philosophy is a sustained dialogue about the deepest questions rather than a list of facts. His questions about reality, knowledge and justice shaped later metaphysics, epistemology, political philosophy and theology."]]},
{id:"aristotle",name:"Aristotle",dates:"384–322 BCE",era:"Ancient Greece",school:"Aristotelianism",portrait:"A",intro:"Aristotle was a Greek philosopher who studied under Plato and later taught Alexander the Great. He developed influential work in logic, biology, physics, metaphysics, ethics, politics, rhetoric and aesthetics. Few thinkers have attempted such a broad systematic account of reality and human life.",body:[
["Causes and explanation","Aristotle explains things through four kinds of cause: material, formal, efficient and final. A bronze statue, for instance, has bronze as material, a particular shape as form, a sculptor as an efficient cause, and a purpose or end that can help explain why it exists as it does. His framework is broader than the modern meaning of 'cause'."],
["Virtue ethics","Aristotle asks what it means for a human life to go well. His answer involves eudaimonia, often translated as flourishing. Flourishing is not merely feeling happy; it is living and acting excellently over a whole life. Virtues are stable dispositions developed through practice."],
["The Golden Mean","Courage lies between cowardice and recklessness, but the 'mean' is not simply an arithmetic middle. The right response depends on circumstances and requires practical wisdom. This is why Aristotle's ethics cannot be reduced to a rulebook."],
["Logic and science","Aristotle systematized forms of deductive reasoning and made extensive observations of nature. Some of his scientific conclusions were later rejected, but his insistence on classification, explanation and systematic inquiry had enormous historical influence."],
["Why he matters","Aristotle offers a different picture from Plato: instead of locating the deepest explanation in a separate realm of Forms, he develops tools for understanding actual things, their structures, changes and purposes. His ethics remains one of the major alternatives to rule-based and consequence-based ethics."]]},
{id:"epicurus",name:"Epicurus",dates:"341–270 BCE",era:"Hellenistic period",school:"Epicureanism",portrait:"E",intro:"Epicurus was a Greek philosopher who founded a community in Athens known as the Garden. He taught that a good life involves pleasure understood primarily as freedom from bodily pain and mental disturbance, together with friendship, modest desires and freedom from unnecessary fears.",body:[
["Pleasure","Epicurus is not simply a philosopher of luxury. He distinguishes stable pleasures from restless forms of desire. A life can become miserable when pleasure is treated as constant stimulation rather than as tranquility and freedom from distress."],
["Desire","He distinguishes natural and necessary desires, natural but unnecessary desires, and empty desires produced by social status or limitless ambition. Philosophy can help a person discover which desires actually contribute to a good life."],
["Death","Epicurus argues that death should not be feared in the way people commonly fear it. While we exist, death is not present; when death arrives, we no longer exist as experiencing subjects. The argument is intended to weaken anxiety about a future state in which there is no subject to suffer it."],
["Friendship","Epicurean communities placed enormous value on friendship. Security and trust between friends can provide a form of stability that wealth and public prestige cannot guarantee."],
["Why he matters","Epicurus offers a philosophy of ordinary happiness: reduce unnecessary fear, understand desire, value friendship and avoid confusing an endless appetite for stimulation with genuine well-being."]]},
{id:"epictetus",name:"Epictetus",dates:"c. 50–135 CE",era:"Roman era",school:"Stoicism",portrait:"E",intro:"Epictetus was a Stoic teacher who was born enslaved and later gained his freedom. His teachings, recorded by his student Arrian, focus on judgment, discipline, responsibility and the difference between what depends on us and what does not.",body:[
["Control","The famous Stoic distinction is not a magical promise that everything outside your control becomes irrelevant. It is a discipline of attention. Your judgments, choices and intentions are more directly yours than other people's actions, accidents or the past."],
["Judgment","For Epictetus, events themselves do not automatically determine our emotional response. Our interpretation of events matters. This does not mean pain is imaginary; it means that the mind can examine the judgment it attaches to an event."],
["Freedom","Because he was born enslaved, Epictetus's discussions of freedom have a striking context. External circumstances can restrict a person's options, but he argues that moral agency should not be identified entirely with external status."],
["Practice","Stoicism is meant to be exercised. A person can rehearse how they will respond to insults, losses, uncertainty and temptation. Philosophy becomes training rather than merely intellectual entertainment."],
["Why he matters","Epictetus is one of the clearest examples of philosophy as a practical discipline. His ideas can be tested against real situations: what exactly is mine to choose here, and what am I pretending I can control?"]]},
{id:"seneca",name:"Seneca",dates:"c. 4 BCE–65 CE",era:"Roman era",school:"Stoicism",portrait:"S",intro:"Seneca was a Roman Stoic philosopher, writer and statesman. His letters and essays explore anger, wealth, death, friendship, time and moral self-command. His own life involved serious tensions between Stoic ideals and political power, which makes him especially interesting to study.",body:[
["Time","In On the Shortness of Life, Seneca argues that people often complain that life is short while spending enormous amounts of it on distraction, status and other people's demands. His point is less about counting years than about whether we actually possess our time."],
["Anger","Seneca treats anger as dangerous because it can become self-reinforcing. He recommends creating distance between the initial emotional reaction and the action that follows it."],
["Wealth","Stoicism does not require everyone to be poor. Seneca argues that wealth can be possessed without being treated as the source of one's worth. The deeper test is whether losing wealth would destroy one's character."],
["Contradiction","Seneca was wealthy and politically powerful while writing about detachment from wealth and power. This does not automatically refute his arguments, but it creates a useful philosophical question: how much must a philosopher embody an ideal for the ideal to be credible?"],
["Why he matters","Seneca is particularly useful for studying the relationship between philosophical theory and actual life. His work invites you to ask whether your principles survive contact with comfort, fear, ambition and pressure."]]},
{id:"marcus",name:"Marcus Aurelius",dates:"121–180 CE",era:"Roman era",school:"Stoicism",portrait:"M",intro:"Marcus Aurelius was Roman emperor from 161 to 180 and a practitioner of Stoic philosophy. His Meditations are personal reflections rather than a formal philosophical system, repeatedly returning to duty, mortality, self-command and perspective.",body:[
["Duty","Marcus repeatedly reminds himself to perform the task appropriate to his role rather than chase praise. Stoic duty is connected to the idea that human beings are social and rational creatures who should contribute to a larger whole."],
["Impermanence","Death and change appear constantly in his reflections. The point is not simply gloomy obsession; mortality is used as a way of correcting inflated importance and bringing attention back to present action."],
["Perspective","Marcus often asks whether an insult, inconvenience or political event will matter when viewed against the scale of time. Perspective is used to weaken vanity without denying that events can be serious."],
["Self-command","The Meditations show philosophy functioning as self-correction. Marcus writes reminders because knowing a principle once is not the same as reliably living by it."],
["Why he matters","He gives an unusually direct picture of philosophical practice: the work is repetitive. You remember, forget, correct yourself, and return to the principle again."]]},
{id:"augustine",name:"Augustine",dates:"354–430",era:"Late Antiquity",school:"Christian philosophy",portrait:"A",intro:"Augustine of Hippo was a North African Christian bishop, theologian and philosopher. He drew on Platonist ideas while developing influential reflections on time, memory, desire, evil, freedom and the self.",body:[
["Time","Augustine famously struggles with the nature of time. The past is no longer present, the future is not yet present, and the present seems to vanish immediately. He turns toward memory, attention and expectation to understand how humans experience time."],
["Memory","Memory is not treated as a simple storage box. Augustine describes it as an enormous interior landscape containing images, knowledge, emotions and traces of experience. His reflections anticipate later philosophical interest in consciousness."],
["Evil","Augustine rejects the idea that evil must be a substance equal to good. He develops a privation account in which evil is understood as a lack or corruption of good rather than an independent thing of equal metaphysical status."],
["Desire","His philosophy repeatedly returns to divided desire: humans can know what they consider good and still find themselves pulled elsewhere. This tension becomes central to later thinking about will and moral psychology."],
["Why he matters","Augustine is a major bridge between ancient philosophy and medieval Christian thought, but his questions are not limited to theology. His discussions of time, memory and inner conflict remain philosophical problems in their own right."]]},
{id:"descartes",name:"René Descartes",dates:"1596–1650",era:"17th century",school:"Rationalism",portrait:"D",intro:"René Descartes was a French philosopher, mathematician and scientific thinker. He is famous for using systematic doubt to search for certainty and for his influential account of mind and body.",body:[
["Methodic doubt","Descartes asks what beliefs can survive radical doubt. The senses can sometimes deceive us. Dreams can feel real. He even imagines an extremely powerful deceiver to test the foundations of belief."],
["The cogito","If Descartes is doubting, then thinking is occurring. From this he reaches the famous cogito: the act of thinking provides a secure indication that a thinking subject exists. The argument is narrower and more precise than the slogan 'I think, therefore I am' often makes it sound."],
["Mind and body","Descartes distinguishes thinking substance from extended physical substance. This contributes to the famous mind-body problem: if mind and matter are fundamentally different kinds of thing, how do they interact?"],
["Rationalism","Descartes gives reason a central role in knowledge and mathematics becomes a model of certainty. His project strongly influences later rationalist philosophers such as Spinoza and Leibniz."],
["Why he matters","Modern philosophy repeatedly returns to Descartes's questions: what can I know, what is the self, and how can an experiencing mind know a world outside itself?"]]},
{id:"hume",name:"David Hume",dates:"1711–1776",era:"18th century",school:"Empiricism",portrait:"H",intro:"David Hume was a Scottish Enlightenment philosopher who investigated human nature, knowledge, causation, morality and religion. His skeptical arguments challenged assumptions that philosophers often treated as obvious.",body:[
["Impressions and ideas","Hume distinguishes vivid experiences or impressions from the fainter ideas that copy them. This leads him to ask where our concepts actually come from: can a meaningful idea be traced to some experience?" ],
["Causation","When one billiard ball strikes another, we observe motion followed by motion. But do we observe a necessary connection itself? Hume argues that our expectation of causation arises from repeated patterns and habit rather than direct perception of necessity."],
["Induction","Induction takes observed cases and projects a pattern into unobserved cases. The sun has risen every day, so we expect it tomorrow. Hume asks what rational argument proves that the future must resemble the past. Any appeal to past regularity already assumes the principle it is trying to justify."],
["Self","Hume also challenges the idea of a simple, unchanging self directly encountered in experience. When he looks inward, he reports a bundle or succession of perceptions rather than a single permanent object of consciousness."],
["Why he matters","Hume teaches philosophical suspicion: separate what experience actually gives you from what your mind habitually adds. His influence reaches epistemology, philosophy of mind, science and ethics."]]},
{id:"kant",name:"Immanuel Kant",dates:"1724–1804",era:"18th century",school:"Critical philosophy",portrait:"K",intro:"Immanuel Kant was a German philosopher who transformed epistemology, metaphysics and ethics. His project responds to both rationalism and empiricism, asking what the mind contributes to experience and what morality requires of autonomous agents.",body:[
["The critical turn","Kant asks not only 'What do we know?' but 'What conditions make knowledge possible?' Instead of treating the mind as a passive receiver, he argues that experience is organized through fundamental structures supplied by the mind."],
["Phenomena and noumena","Kant distinguishes things as they appear within human experience from things considered independently of our mode of cognition. This does not simply mean 'the world is fake'; it means our knowledge is always shaped by the conditions under which humans can experience objects."],
["Morality","Kant's ethics centers on autonomy and universal principles. A moral rule should not merely describe what we happen to want. The moral agent should be able to regard the principle of action as something that could be willed universally."],
["Persons as ends","Kant argues that rational persons must not be treated merely as tools for someone else's purposes. This becomes a major source for later discussions of dignity, rights and respect."],
["Why he matters","Kant changes the terms of the debate. Instead of choosing simply between reason and experience, he investigates how the two work together and asks what the structure of human cognition permits us to know."]]},
{id:"schopenhauer",name:"Arthur Schopenhauer",dates:"1788–1860",era:"19th century",school:"Pessimism",portrait:"S",intro:"Arthur Schopenhauer was a German philosopher whose system combines ideas from Kant with his own account of a fundamental striving he calls Will. His philosophy is famously pessimistic and deeply concerned with desire, suffering, art and compassion.",body:[
["The Will","Schopenhauer distinguishes the world as representation—the world as it appears to a subject—from an underlying Will, conceived as blind striving. Living things continually seek, move, desire and struggle."],
["The cycle of desire","If you lack something, you suffer from wanting it. If you obtain it, satisfaction is temporary. Soon another desire appears, or boredom arrives. Schopenhauer therefore sees ordinary life as oscillating between suffering and boredom."],
["Art","Schopenhauer thinks aesthetic contemplation can temporarily suspend ordinary willing. Music receives especially high status because he sees it as expressing the structure of Will more directly than representational art."],
["Compassion","Despite his pessimism, Schopenhauer sees compassion as ethically significant. Recognizing that other beings also suffer can weaken the egoistic separation between self and other."],
["Why he matters","He influenced Nietzsche, Freud and later pessimistic and existential thinkers. He is useful whenever you want to ask whether desire is a path to happiness or a mechanism that continually recreates dissatisfaction."]]},
{id:"kierkegaard",name:"Søren Kierkegaard",dates:"1813–1855",era:"19th century",school:"Existential thought",portrait:"K",intro:"Søren Kierkegaard was a Danish philosopher and religious writer who focused on the individual, choice, anxiety, despair, commitment and faith. He is often described as a precursor or founder of existential philosophy.",body:[
["The individual","Kierkegaard distrusts systems that explain existence from a distance while ignoring the person who actually has to live. A theory can describe humanity without answering what a particular individual should do."],
["Anxiety","Freedom creates possibility. The fact that you can choose can therefore produce anxiety: you confront possibilities without a guaranteed instruction manual. Anxiety is connected to the experience of freedom itself."],
["Despair","Kierkegaard describes despair as a troubled relationship to oneself. One can refuse to be oneself, desperately attempt to become a self on one's own terms, or confront the deeper source of one's existence."],
["Faith","His religious philosophy emphasizes commitment that cannot be reduced to detached proof. This creates a sharp tension between objective certainty and subjective existence."],
["Why he matters","Kierkegaard makes the lived individual central. He asks what happens when abstract explanations stop protecting you from the necessity of actually choosing."]]},
{id:"marx",name:"Karl Marx",dates:"1818–1883",era:"19th century",school:"Historical materialism",portrait:"M",intro:"Karl Marx was a German philosopher, economist and political theorist whose writings analyze capitalism, labor, class relations and historical change. His work influenced philosophy, economics, sociology, political theory and revolutionary movements.",body:[
["Material conditions","Marx argues that social life cannot be understood solely through ideas. How people produce, exchange and control material resources shapes institutions and social relationships."],
["Class","A central Marxian analysis concerns conflicts between classes with different relationships to productive property and labor. Under capitalism, Marx focuses especially on the relationship between capital owners and wage laborers."],
["Alienation","In his early writings, Marx describes forms of alienation in which workers can become separated from what they produce, the activity of working, other people and their own human capacities."],
["Ideology","Marx and later Marxist thinkers investigate how social arrangements can appear natural or inevitable even though they are historically produced. This raises the question of how beliefs relate to material and institutional power."],
["Why he matters","Marx shifts philosophical attention toward structures: not only what an individual believes or chooses, but how economic systems and social relations shape the field in which individual choices occur."]]},
{id:"nietzsche",name:"Friedrich Nietzsche",dates:"1844–1900",era:"19th century",school:"Genealogy / existential thought",portrait:"N",intro:"Friedrich Nietzsche was a German philosopher and cultural critic who attacked inherited assumptions about morality, religion, truth, suffering and human excellence. He is famous for provocative aphorisms, but his deeper project is an investigation of how values are created and what kinds of life they produce.",body:[
["The death of God","Nietzsche's declaration that 'God is dead' is not simply a biological or metaphysical claim. It describes a cultural crisis: traditional Christian frameworks are losing their unquestioned authority. The problem becomes what happens to values after their old foundation weakens."],
["Genealogy","Instead of asking only whether a moral value is true, Nietzsche asks where it came from. Genealogy investigates historical processes, psychological motives and struggles that produced particular values."],
["Master and slave morality","Nietzsche contrasts different styles of valuation and argues that ressentiment can transform weakness, suffering and inability to act into moral condemnation of strength or excellence. His analysis is controversial and must be read carefully rather than reduced to 'be strong.'"],
["Nihilism","If inherited values lose authority but no replacement has been created, people can experience nihilism: a collapse or rejection of meaning and value. Nietzsche sees overcoming nihilism as a major cultural task."],
["Self-overcoming","Nietzsche's ideal is not simply domination of others. He repeatedly emphasizes overcoming one's own limitations, inherited assumptions and reactive habits. Creation of values becomes an active task."],
["Why he matters","Nietzsche changes philosophy's style as well as its content. He makes suspicion of moral origins, psychology, culture and power central to philosophical inquiry."]]},
{id:"heidegger",name:"Martin Heidegger",dates:"1889–1976",era:"20th century",school:"Phenomenology / existential thought",portrait:"H",intro:"Martin Heidegger was a German philosopher whose central question is the meaning of Being. His work examines existence, temporality, anxiety, everyday social life and authenticity, and had enormous influence on continental philosophy.",body:[
["The question of Being","Heidegger thinks philosophy has often studied particular beings while forgetting the more fundamental question of what it means for something to be at all. He calls this the question of Being."],
["Dasein","Heidegger uses the German term Dasein for the kind of being that has a relationship to its own existence—human existence as situated, involved and self-interpreting. It is not simply a fancy synonym for 'person'."],
["The They","Everyday life often follows anonymous social expectations: what 'one' does, thinks, buys or believes. Heidegger calls this anonymous social mode das Man, often translated as 'the They.'"],
["Authenticity","Authenticity is not simply being quirky or unique. It involves confronting one's own finite existence and taking ownership of possibilities rather than hiding entirely inside anonymous social routines."],
["Being-toward-death","Mortality individualizes existence. No one can die your death for you. Confronting finitude can therefore change how possibilities and priorities appear."],
["Why he matters","Heidegger radically expands the study of existence by examining how time, mood, social life and mortality structure the way a human being encounters a world."]]},
{id:"sartre",name:"Jean-Paul Sartre",dates:"1905–1980",era:"20th century",school:"Existentialism",portrait:"S",intro:"Jean-Paul Sartre was a French philosopher, novelist, playwright and public intellectual. He developed a major form of existentialism centered on freedom, consciousness, responsibility and the construction of identity.",body:[
["Existence precedes essence","Sartre argues that humans are not manufactured objects with a predetermined purpose. We exist first and define ourselves through what we do. This does not mean we can become literally anything; our choices always occur within circumstances we did not choose."],
["Freedom","Sartre's freedom is uncomfortable. We are continually responsible for how we respond to our circumstances. Even refusing to choose can function as a choice."],
["Bad faith","Bad faith is self-deception about one's freedom. A person may treat themselves as nothing more than a fixed role—'I am just a waiter,' 'I am just this kind of person'—to avoid confronting their ability to choose how they inhabit that role."],
["The gaze","Other people can become mirrors through which we experience ourselves as objects in their world. Sartre explores how this can create conflict: I want to control how I am seen, but I cannot fully control another person's consciousness."],
["Why he matters","Sartre turns freedom into a burden as well as a possibility. His philosophy asks whether you are genuinely choosing your life or hiding behind roles, expectations and excuses."]]},
{id:"camus",name:"Albert Camus",dates:"1913–1960",era:"20th century",school:"Absurdism",portrait:"C",intro:"Albert Camus was a French-Algerian writer and philosopher associated with absurdism. His work explores meaning, mortality, freedom, rebellion, violence and how to live when the universe offers no guaranteed answer to human longing.",body:[
["The Absurd","Humans want coherence, justice and meaning. The universe does not promise to provide them. The Absurd is born from the collision between these two facts, not simply from the claim that 'nothing matters.'"],
["Revolt","Camus rejects both surrender and false certainty. His response is revolt: continue living, creating, loving and thinking while remaining lucid about the absence of a guaranteed cosmic solution."],
["Sisyphus","Camus interprets the myth of Sisyphus as an image of repetitive human effort. The philosophical question is not how to magically escape repetition but whether one can live consciously without pretending that the universe owes us a final explanation."],
["Ethics and limits","Camus later became increasingly concerned with political violence and the temptation to justify present suffering through promises of a perfect future. He argues for limits and solidarity rather than treating people as expendable means."],
["Why he matters","Camus provides a powerful alternative to both nihilistic surrender and easy optimism: meaning can be lived and created without being guaranteed by the cosmos."]]},
{id:"wittgenstein",name:"Ludwig Wittgenstein",dates:"1889–1951",era:"20th century",school:"Analytic philosophy",portrait:"W",intro:"Ludwig Wittgenstein was an Austrian-British philosopher whose work transformed the philosophy of language and logic. His early and later philosophies differ dramatically, but both investigate how language can generate or dissolve philosophical problems.",body:[
["Early Wittgenstein","The Tractatus presents a highly structured picture of language and the world, suggesting that meaningful propositions represent possible states of affairs. It ends with a famous distinction between what can be said and what must be shown."],
["Later Wittgenstein","In Philosophical Investigations, Wittgenstein abandons the idea that every meaningful word must work by picturing an object. Instead, he examines how words function in practices."],
["Language games","A word can function differently in different activities: ordering, joking, promising, calculating, greeting and describing. Meaning is therefore closely connected to use rather than a single hidden essence shared by every occurrence."],
["Philosophical confusion","Wittgenstein often thinks philosophy gets stuck when language is pulled out of its ordinary context. The cure can be conceptual clarification rather than construction of a grand metaphysical theory."],
["Why he matters","He changes the philosopher's job from discovering mysterious objects behind words to carefully examining what people actually do with language."]]},
{id:"rawls",name:"John Rawls",dates:"1921–2002",era:"20th century",school:"Political philosophy",portrait:"R",intro:"John Rawls was an American political philosopher who developed a major theory of justice. His famous thought experiment, the original position behind a veil of ignorance, asks what principles people would choose if they did not know their eventual place in society.",body:[
["The original position","Rawls asks people to imagine choosing the basic principles of society before knowing their own position within it. You do not know your class, talents, wealth, gender or social status."],
["The veil of ignorance","The veil removes information that could allow you to design rules for your own advantage. The idea is not that real people can forget their identities, but that impartial reasoning can be modeled through a hypothetical situation."],
["Justice","Rawls's project is concerned with fair terms of social cooperation. He argues for principles governing basic liberties and inequalities, with particular attention to how social arrangements affect those who are less advantaged."],
["Why the thought experiment matters","The thought experiment is powerful because it changes the question from 'What rules benefit me?' to 'What rules could I accept without knowing where I would end up?'"],
["Why he matters","Rawls revitalized systematic political philosophy and influenced debates about equality, rights, institutions, welfare and fairness."]]}
];

const I = [
["epistemology","Epistemology","What can we know?","Epistemology studies knowledge, justification, belief and the limits of understanding. A classic question is what separates genuine knowledge from a lucky guess or a strongly held opinion.","Descartes searches for certainty; Hume challenges the basis of induction; Kant asks what conditions make knowledge possible."],
["metaphysics","Metaphysics","What is reality?","Metaphysics investigates fundamental questions about existence, identity, possibility, causation, time, mind and the structure of reality.","Plato asks about Forms; Aristotle studies substance and causes; Descartes distinguishes mind and body."],
["ontology","Ontology","What exists?","Ontology is the part of metaphysics concerned especially with being and existence. It asks what kinds of things there are and what it means for something to exist.","Heidegger makes the question of Being central to his philosophy."],
["ethics","Ethics","What should we do?","Ethics investigates moral value, obligation, character, responsibility and the good life. It asks not only what people do but what they ought to do.","Aristotle, Kant, Mill, Nietzsche and many others offer very different approaches."],
["virtue ethics","Virtue Ethics","What kind of person should I become?","Virtue ethics evaluates life through character and flourishing. Instead of giving a complete list of permitted actions, it asks which traits make a human life excellent and how those traits are cultivated.","Aristotle is the central classical source."],
["deontology","Deontology","Are some actions wrong regardless of outcome?","Deontological ethics emphasizes duties, rules or constraints. Kant's ethics is the most famous example: moral action should be guided by principles that can be rationally universalized.","Kant argues that persons should not be treated merely as means."],
["consequentialism","Consequentialism","What results should we produce?","Consequentialist theories judge actions by their consequences. Utilitarianism is one influential form, evaluating actions by their effects on overall well-being.","This creates difficult questions about sacrifice, fairness and whether outcomes can justify normally forbidden actions."],
["stoicism","Stoicism","How should I live under uncertainty?","Stoicism is a Hellenistic tradition centered on virtue, disciplined judgment and the distinction between what depends on us and what does not. It is not simply emotional suppression.","Epictetus, Seneca and Marcus Aurelius are major Roman Stoic figures."],
["socratic method","Socratic Method","How do we test what we think we know?","The Socratic method uses questioning to examine definitions, assumptions and contradictions. The goal is often to reveal that a confident belief is less clear than it first appeared.","It is especially useful for learning philosophy because it turns passive reading into active examination."],
["forms","Theory of Forms","Are physical things the whole of reality?","Plato's Forms are stable intelligible realities used to explain how knowledge can concern things that are more stable than changing physical objects. The theory develops across his dialogues.","The Cave is often read alongside this problem of appearance and reality."],
["induction","Problem of Induction","Why should the future resemble the past?","Inductive reasoning generalizes from observed cases to unobserved cases. Hume argues that no deductive proof establishes that future regularities must continue.","Science uses inductive methods, so Hume's problem remains important even when one rejects his strongest skeptical conclusions."],
["cogito","Cogito","What survives radical doubt?","Descartes's cogito is the insight that doubting or thinking cannot occur without there being a thinker engaged in that activity. It becomes a foundational point in his search for certainty.","It does not by itself prove everything else about the world."],
["genealogy","Genealogy","Where did our values come from?","Genealogical analysis investigates the historical, psychological and social formation of concepts and values. Nietzsche uses it to question whether moral categories are as timeless and neutral as they appear.","It shifts attention from 'Is this value true?' toward 'How did this value become authoritative?'"],
["nihilism","Nihilism","What happens when values lose authority?","Nihilism can refer to several positions, but in Nietzsche's context it describes a crisis in which inherited sources of meaning and value lose their force. It is not simply 'believing in nothing.'","Nietzsche treats overcoming nihilism as a major challenge."],
["absurdism","Absurdism","Can life have meaning without cosmic guarantees?","Camus's absurdism begins with the tension between human demands for meaning and a universe that does not guarantee an answer. His response emphasizes lucid living, revolt and solidarity rather than surrender.","The Absurd is a relationship between humans and world, not merely a property of the world."],
["existentialism","Existentialism","What do freedom and responsibility mean?","Existentialism is a broad family of philosophies concerned with existence, freedom, anxiety, responsibility, authenticity and meaning. Thinkers grouped under the label disagree sharply.","Kierkegaard, Heidegger, Sartre and others are connected to existential themes in different ways."],
["phenomenology","Phenomenology","How does experience appear from within?","Phenomenology studies the structures of lived experience. Instead of beginning with an abstract theory of the mind, it asks how perception, time, embodiment and objects are actually experienced.","Husserl developed the method; Heidegger, Merleau-Ponty and others transformed it."],
["alienation","Alienation","What does it mean to become separated from your own activity?","Alienation means estrangement or separation. Marx uses it to analyze how labor under particular economic arrangements can separate workers from products, activity, other people and aspects of human potential.","The concept is broader than simply 'having a bad job.'"],
["bad faith","Bad Faith","How do we lie to ourselves about freedom?","Sartre's bad faith is a form of self-deception in which someone denies or disguises their freedom by treating themselves as completely fixed by a role, situation or identity.","The concept is difficult because the person is both deceiver and deceived."],
["eudaimonia","Eudaimonia","What does human flourishing mean?","Aristotle's eudaimonia is often translated as flourishing or living well. It is not merely a pleasant mood; it describes a whole life of excellent human activity.","Virtue and practical wisdom are central to Aristotle's account."],
["teleology","Teleology","Can things be explained by their ends?","Teleological explanation refers to purposes, goals or ends. Aristotle's philosophy often explains natural and human phenomena partly through what they are for.","Modern science generally uses different explanatory frameworks, making Aristotle's teleology historically important."],
["autonomy","Autonomy","What does it mean to govern yourself?","Autonomy means self-governance. In Kant, moral autonomy involves rationally legislating principles for oneself rather than simply obeying external pressure or desire.","Autonomy is central to later ideas about dignity and rights."],
["determinism","Determinism","Are all events fixed by prior conditions?","Determinism is the thesis that, given the complete state of the world and its laws, later events are fixed. It is not identical to fatalism, because fatalism does not require the same causal structure.","The relationship between determinism and free will remains disputed."],
["free will","Free Will","Could you genuinely have done otherwise?","Free will concerns the conditions under which a choice counts as genuinely yours. Philosophers disagree about whether freedom requires alternative possibilities, rational self-control, absence of coercion or something else.","Compatibilists argue that freedom can coexist with determinism; incompatibilists disagree."],
["solipsism","Solipsism","Can I know anything beyond my own mind?","Solipsism is an extreme skeptical position according to which only one's own mind can be known to exist, or in stronger versions, only one's own mind exists.","Most philosophers reject it, but it exposes difficult assumptions about how minds know an external world."],
["dialectic","Dialectic","Can contradiction drive philosophical development?","Dialectic can refer to several traditions of reasoning through opposing positions. In Plato it often appears as philosophical dialogue; in Hegel it becomes a model of conceptual and historical development through tensions.","The word should never be assumed to have one meaning across all philosophers."]
];

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function glossary(text){
 const keys=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
 let out=esc(text);
 for(const k of keys){
   const re=new RegExp("\\b("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","gi");
   out=out.replace(re,m=>`<span class="term" onclick="showTerm('${k.replace(/'/g,"\\'")}')">${m}</span>`);
 }
 return out;
}
const GLOSS={
"epistemology":"The branch of philosophy concerned with knowledge, justification, belief and the limits of understanding.",
"metaphysics":"The study of fundamental questions about reality, existence, identity, possibility, causation, time and mind.",
"ontology":"The study of being and what exists: what kinds of things there are and what it means for something to exist.",
"empiricism":"A family of views giving sensory experience and observation a fundamental role in knowledge.",
"rationalism":"A family of views giving reason a major role in knowledge, sometimes holding that reason can establish truths not derived from experience.",
"skepticism":"A method or position that questions whether a belief is sufficiently justified or whether knowledge of some kind is possible.",
"induction":"Reasoning from observed cases toward general claims or expectations about cases not yet observed.",
"causation":"A relation in which one event, state or process is understood to bring about another.",
"virtue":"A stable and valuable trait of character, such as courage or justice.",
"eudaimonia":"Aristotle's term usually translated as flourishing or living well across a whole life.",
"teleology":"Explanation in terms of an end, purpose or goal.",
"deontology":"An ethical approach emphasizing duties, rules or constraints on action.",
"consequentialism":"An ethical family that evaluates actions primarily by their consequences.",
"phenomenology":"The philosophical study of lived experience and the structures through which things appear to consciousness.",
"existentialism":"A broad family of philosophies concerned with existence, freedom, responsibility, anxiety and meaning.",
"absurd":"For Camus, the conflict between human demand for meaning and a world that does not guarantee an answer.",
"nihilism":"A family of positions involving the rejection, denial or collapse of objective meaning or value; its exact claims differ.",
"alienation":"Estrangement or separation. Marx uses the idea to analyze forms of separation within labor and social relations.",
"genealogy":"A historical investigation of how concepts or values arose and became authoritative.",
"autonomy":"Self-government: directing one's reasoning or action rather than simply being ruled by another.",
"authenticity":"An ideal of taking ownership of one's existence and possibilities rather than hiding entirely within anonymous social expectations.",
"bad faith":"Sartre's term for self-deception in which someone evades their freedom by treating themselves as completely fixed by a role or circumstance.",
"determinism":"The thesis that, given the complete prior state of the world and its laws, later events are fixed.",
"free will":"The philosophical problem of what makes a choice genuinely yours and under what conditions you can be responsible for it.",
"solipsism":"An extreme skeptical position claiming that only one's own mind can be known to exist, or in stronger versions, that only one's own mind exists.",
"dialectic":"A mode of philosophical development or reasoning through opposing positions, dialogue or contradiction; its meaning varies by philosopher.",
"aporia":"A state of puzzlement in which a person recognizes that an argument has left them without an easy answer.",
"maxim":"In Kantian ethics, a subjective principle or policy on which a person acts.",
"categorical imperative":"Kant's framework for testing moral principles by asking whether they could be universalized and whether persons are respected as ends.",
"original position":"Rawls's hypothetical situation for choosing principles of justice without knowing one's future social position.",
"veil of ignorance":"Rawls's device of withholding knowledge of one's future status, talents and social position during the choice of principles.",
"phenomena":"In Kant, things as they appear within human experience.",
"noumena":"In Kant, things considered independently of the human mode of experience; they are not objects of ordinary empirical knowledge.",
"platonism":"A family of philosophical traditions inspired by Plato, especially his views about Forms, knowledge and reality.",
"stoicism":"A Hellenistic philosophical tradition emphasizing virtue, disciplined judgment and the distinction between what depends on us and what does not."
};
