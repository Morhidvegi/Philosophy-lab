entally situated in practical involvement with a world rather than detached observation.","Heidegger"],["the-they","Phenomenology","The They","Heidegger’s description of anonymous social norms that shape everyday behavior and what seems normal or acceptable.","Heidegger"],["authenticity-concept","Phenomenology","Authenticity","A contested ideal of owning one’s possibilities and finitude rather than living entirely according to anonymous expectations.","Heidegger; Sartre"],["falsification","Science","Falsification","Popper’s methodological emphasis on exposing theories to possible refutation rather than treating accumulated confirmations as decisive proof.","Popper"],["paradigm","Science","Paradigm","Kuhn’s term for a shared scientific framework, exemplary problems and standards that guide normal research.","Kuhn"],["normal-science","Science","Normal science","Kuhn’s term for research conducted within an established scientific paradigm, solving puzzles rather than constantly questioning basic assumptions.","Kuhn"],["scientific-revolution","Science","Scientific revolution","A period in which a scientific community reorganizes its basic framework, standards or problems.","Kuhn"],["underdetermination","Science","Underdetermination","The idea that available evidence may be compatible with more than one theory, so evidence alone may not uniquely determine a theory.","Duhem; Quine"],["analytic-synthetic","Language","Analytic/synthetic distinction","The distinction between truths understood as true by virtue of meaning and truths requiring substantive engagement with how the world is; Quine famously challenged a sharp version of it.","Kant; Quine"],["a-priori","Epistemology","A priori","Knowledge or justification claimed not to depend on particular empirical observations, though philosophers disagree about what this amounts to.","Leibniz; Kant"],["a-posteriori","Epistemology","A posteriori","Knowledge or justification dependent in some relevant sense on experience or observation.","Empiricism; Kant"],["necessary-being","Metaphysics","Necessary being","A being whose existence is not contingent, used in various cosmological and modal arguments.","Avicenna; Leibniz"],["ontological-argument","Philosophy of religion","Ontological argument","Arguments attempting to infer God’s existence from the concept or definition of a maximally perfect or necessary being.","Anselm; Descartes; Kant"],["problem-of-evil","Philosophy of religion","Problem of evil","The challenge of reconciling the existence of evil and suffering with claims about an all-powerful, all-knowing and perfectly good God.","Augustine; Leibniz; Hume"],["free-will-defense","Philosophy of religion","Free-will defense","An attempt to explain how evil might be compatible with divine goodness if significant creaturely freedom has value.","Augustine; Plantinga"],["aesthetic-judgment","Aesthetics","Aesthetic judgment","The philosophical problem of how judgments of beauty, art and taste can claim more than merely private preference.","Kant; Hume"],["sublime","Aesthetics","The sublime","An aesthetic experience involving overwhelming magnitude or power that exceeds ordinary representation and challenges the imagination.","Burke; Kant"],["art-world","Aesthetics","Artworld","Danto’s idea that artworks are identified partly within a theoretical and historical context that makes certain objects count as art.","Danto"],["originality","Aesthetics","Originality","The question of whether artistic value depends on novelty, innovation, tradition, expression or transformation.","Romanticism; contemporary aesthetics"]];

function megaHome(){
 document.getElementById('view').innerHTML=`<section class="hero megaHero"><div class="kicker">PHILOSOPHY LAB · LONG-TERM EDITION</div><h2>Don’t finish philosophy. Build a mind that can keep doing it.</h2><p>This library is designed for years of study. Learn historically, follow problems across centuries, read primary texts, reconstruct arguments, test your own views, and deliberately revisit what you forget.</p><div class="megaActions"><button class="btn" onclick="go('paths')">Choose a path</button><button class="btn secondary" onclick="go('problems')">Study a problem</button><button class="btn secondary" onclick="go('texts')">Enter the text room</button></div></section><div class="grid megaGrid"><div class="card clickable" onclick="go('philosophers')"><div class="kicker">LIBRARY</div><h3>${P.length} philosophers</h3><p>From the Presocratics to contemporary thinkers. Open people, compare them and follow their arguments.</p></div><div class="card clickable" onclick="go('ideas')"><div class="kicker">CONCEPTS</div><h3>${I.length} concepts</h3><p>Not dictionary entries: problems, distinctions, objections and connections.</p></div><div class="card clickable" onclick="go('problems')"><div class="kicker">PHILOSOPHICAL PROBLEMS</div><h3>${PROBLEMS.length} big questions</h3><p>Study philosophy by question rather than by biography.</p></div><div class="card clickable" onclick="go('texts')"><div class="kicker">PRIMARY TEXTS</div><h3>${TEXTS.length} reading guides</h3><p>Go to the source. Read slowly. Reconstruct what the author actually argues.</p></div><div class="card clickable" onclick="go('schools')"><div class="kicker">TRADITIONS</div><h3>${SCHOOLS.length} schools</h3><p>See how philosophers inherit, reject and transform one another.</p></div><div class="card clickable" onclick="go('review')"><div class="kicker">LONG-TERM MEMORY</div><h3>Spaced review</h3><p>Bring old ideas back before they disappear from memory.</p></div></div><section class="card reading"><div class="kicker">HOW TO USE THIS</div><h2>The rule: never confuse recognition with understanding.</h2><p>Reading a paragraph and thinking “yeah, that makes sense” is recognition. Close the page and reconstruct the argument yourself. That is understanding.</p><div class="notice"><b>Study loop:</b> Read → close the page → reconstruct → object → compare → revisit later → explain it to yourself again.</div></section>`
}
function paths(){
 const paths=[['Chronological','Presocratics → Socrates → Plato → Aristotle → Hellenistic schools → medieval philosophy → early modern philosophy → Kant → 19th century → 20th century.','course'],['Ethics','Virtue → pleasure → duty → consequences → existential ethics → care → contemporary moral disagreement.','ideas'],['Knowledge','Skepticism → rationalism → empiricism → Kant → phenomenology → analytic epistemology → science.','ideas'],['Reality','Being → Forms → substance → mind/body → monism → idealism → phenomenology → contemporary metaphysics.','ideas'],['Freedom','Stoic agency → social contract → autonomy → determinism → existential freedom → political liberty.','ideas'],['Political philosophy','Justice → authority → contract → liberty → equality → ideology → recognition → deliberation.','problems'],['Mind','Soul → dualism → identity → consciousness → intentionality → embodiment → computation.','problems'],['Language','Logic → reference → meaning → language-games → speech acts → interpretation.','texts']];
 document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">CURRICULA</div><h2>Choose what kind of philosopher you want to become.</h2><p class="muted">You can change paths whenever you want. The point is to build connections between ideas.</p><div class="grid">${paths.map(x=>`<div class="card clickable" onclick="go('${x[2]}')"><div class="kicker">PATH</div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p><button class="smallbtn">Enter →</button></div>`).join('')}</div></div>`
}
function schools(){
 document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">TRADITIONS</div><h2>Schools, movements and traditions</h2><input class="search" id="ssearch" placeholder="Search a school..." oninput="filterSchools()"><div id="slist" class="grid">${SCHOOLS.map(schoolCard).join('')}</div></div>`
}
function schoolCard(x){return `<div class="card"><div class="kicker">${esc(x[0])}</div><h3>${esc(x[1])}</h3><p class="muted">Key figures: ${esc(x[2])}</p><button class="smallbtn" onclick="schoolDetail('${esc(x[0]).replace(/'/g,"\\'")}')">Study this tradition</button></div>`}
function filterSchools(){let q=document.getElementById('ssearch').value.toLowerCase();document.getElementById('slist').innerHTML=SCHOOLS.filter(x=>x.join(' ').toLowerCase().includes(q)).map(schoolCard).join('')||'<div class="empty">No tradition found.</div>'}
function schoolDetail(name){let x=SCHOOLS.find(s=>s[0]===name);let people=P.filter(p=>x&&x[2].toLowerCase().includes(p.name.split(' ')[0].toLowerCase()));document.getElementById('view').innerHTML=`<div class="back"><button class="btn secondary" onclick="go('schools')">← Traditions</button></div><article class="card reading"><div class="kicker">TRADITION</div><h2>${esc(x[0])}</h2><p>${glossary(x[1])}</p><h2>How to study it</h2><p>Ask what problem the tradition thinks philosophy should solve, what its basic picture of the human being is, what it treats as evidence, and what its strongest rival says against it.</p><h2>Figures to investigate</h2><div class="grid">${people.length?people.map(personCard).join(''):x[2].split(';').map(n=>`<div class="card"><h3>${esc(n)}</h3><p class="muted">Search the philosopher library for this figure.</p></div>`).join('')}</div><div class="notice"><b>Comparison exercise:</b> Explain this tradition without praising or attacking it. Then write the strongest argument you can against it.</div></article>`}
function problems(){document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">QUESTIONS</div><h2>Philosophical problems</h2><p class="muted">The same questions keep returning because the answers create new problems.</p><div class="grid">${PROBLEMS.map((x,i)=>`<div class="card clickable" onclick="problemDetail(${i})"><div class="kicker">${esc(x[1])}</div><h3>${esc(x[0])}</h3><p>${esc(x[2])}</p><p class="muted">Figures: ${esc(x[3])}</p></div>`).join('')}</div></div>`}
function problemDetail(i){let x=PROBLEMS[i];let names=x[3].split(';').map(a=>a.trim());let people=P.filter(p=>names.some(n=>p.name.toLowerCase().includes(n.toLowerCase())||n.toLowerCase().includes(p.name.split(' ')[0].toLowerCase())));document.getElementById('view').innerHTML=`<div class="back"><button class="btn secondary" onclick="go('problems')">← Problems</button></div><article class="card reading"><div class="kicker">${esc(x[1])}</div><h2>${esc(x[0])}</h2><p>${esc(x[2])}</p><h2>Build the map</h2><ol><li>Define the problem precisely.</li><li>State the strongest argument for one answer.</li><li>State the strongest objection.</li><li>Give a rival answer.</li><li>Identify which premise you personally find least secure.</li></ol><h2>Philosophers to compare</h2><div class="grid">${people.map(personCard).join('')}</div><div class="depth"><h2>Your position</h2><textarea class="notearea" placeholder="Write your current answer. Revisit it after studying at least three competing approaches."></textarea></div></article>`}
function texts(){document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">PRIMARY TEXT ROOM</div><h2>Read the philosophers themselves.</h2><p class="muted">These are reading guides, not replacements for the texts. Use a translation or edition you trust, then use these prompts to read actively.</p><div class="grid">${TEXTS.map((x,i)=>`<div class="card clickable" onclick="textDetail(${i})"><div class="kicker">${esc(x[0])}</div><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p></div>`).join('')}</div></div>`}
function textDetail(i){let x=TEXTS[i];document.getElementById('view').innerHTML=`<div class="back"><button class="btn secondary" onclick="go('texts')">← Text room</button></div><article class="card reading"><div class="kicker">PRIMARY TEXT GUIDE</div><h2>${esc(x[0])} — ${esc(x[1])}</h2><p>${esc(x[2])}</p><h2>Reading question</h2><div class="quote">${esc(x[3])}</div><h2>Active reading protocol</h2><ol><li>Read a short section without notes.</li><li>Write the conclusion in your own words.</li><li>List the premises you think the author uses.</li><li>Find one sentence you think is doing the most argumentative work.</li><li>Write the strongest objection you can.</li></ol><h2>After reading</h2><p>Do not ask only “What did the author say?” Ask “What would have to be true for this argument to work?” and “What would make the author change their mind?”</p></article>`}
function review(){let mastered=state.mastery||{};let due=P.filter(p=>!mastered[p.id]||((state.review&&state.review[p.id])||0)<=Date.now());document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">SPACED REVIEW</div><h2>Bring old philosophy back.</h2><p>Choose a philosopher, recall them without looking, then grade your own recall. The app schedules the next revisit locally on your phone.</p><div class="grid">${due.slice(0,12).map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">Recall: problem → argument → objection → influence.</p><button class="smallbtn" onclick="reviewOne('${p.id}')">Start review</button></div>`).join('')||'<div class="notice">Nothing is due in this view. Browse the library and mark something for review.</div>'}</div></div>`}
function reviewOne(id){let p=P.find(x=>x.id===id);document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">RECALL</div><h2>${esc(p.name)}</h2><p>Without opening the entry, write or say aloud: Who were they? What problem were they solving? What was their central argument? What is the strongest objection?</p><textarea class="notearea" id="reviewAnswer" placeholder="Your recall..."></textarea><div class="studytools"><button class="btn" onclick="gradeReview('${id}',1)">Hard</button><button class="btn" onclick="gradeReview('${id}',2)">Okay</button><button class="btn" onclick="gradeReview('${id}',3)">Easy</button><button class="btn secondary" onclick="go('person','${id}')">Now reveal</button></div></div>`}
function gradeReview(id,g){state.review=state.review||{};let days=g===1?1:g===2?4:14;state.review[id]=Date.now()+days*86400000;save();go('review')}
function megaSearch(){let q=(document.getElementById('megaSearch')?.value||'').toLowerCase().trim();if(!q)return;let people=P.filter(p=>(p.name+' '+p.era+' '+p.school+' '+p.intro+' '+p.body.flat().join(' ')).toLowerCase().includes(q)).slice(0,8);let ideas=I.filter(x=>x.join(' ').toLowerCase().includes(q)).slice(0,8);document.getElementById('view').innerHTML=`<div class="card"><div class="kicker">SEARCH</div><h2>Results for “${esc(q)}”</h2><h3>Philosophers</h3><div class="grid">${people.map(personCard).join('')||'<p class="muted">None.</p>'}</div><h3>Concepts</h3><div class="grid">${ideas.map(ideaCard).join('')||'<p class="muted">None.</p>'}</div></div>`}
